name: api-contract

# Row 81: openapi.yaml must match the real server routes.
# A route added, removed or re-methoded in server/* without updating openapi.yaml (or the reverse)
# turns this workflow red. It also validates the document as OpenAPI 3 and runs the gate's
# negative controls, which prove the gate really fails.
# Complements row 64 (sync contract tests); the owner platform API keeps its own
# apps/owner-panel/server/openapi.json.

on:
  push:
    branches: [main, 'arena/**', 'hermes/**']
    paths:
      - 'server/**'
      - 'openapi.yaml'
      - 'tools/openapi-drift-81.mjs'
      - 'tests/openapi-drift-81.js'
      - '.github/workflows/api-contract.yml'
      - 'docs/cloud/contracts/**'
      - 'tools/directory-client-66.mjs'
      - 'tools/cell-transfer-54.mjs'
      - 'tests/contract-vectors-64.js'
      - 'tests/native-contract-64.js'
      - 'tests/directory-66.js'
      - 'tests/cell-transfer-54.js'
      - 'tests/gateway-67.js'
      - 'tests/offline-119.js'
      - 'tests/field-crypto-87.js'
      - 'tools/field-rekey-87.mjs'
      - 'tests/load-82.js'
      - 'tools/load-82.mjs'
      - 'tests/fixtures/load-82-inject.cjs'
      - 'tests/load-82-direct.js'
      - 'tools/load-82-direct.mjs'
      - 'tests/migrations-86.js'
      - 'tools/migrate-86.mjs'
      - 'db/migrations/direct/**'
      - 'tests/direct-identity-106.js'
      - 'tests/e2e-keys-107.js'
      - 'tests/e2e1-107.js'
      - 'tools/e2e1.js'
      - 'tools/e2e1-vectors-107.mjs'
      - 'docs/cloud/contracts/e2e1-vectors-107.json'
      - 'tests/direct-sync-108.js'
      - 'tests/rls-pentest-109.js'
      - 'tests/telemetry-80.js'
      - 'client/telemetry.js'
      - 'tests/privacy-88.js'
      - 'tests/transport-110.js'
      - 'tools/backup-111.mjs'
      - 'tools/backup-drill-111.mjs'
      - 'client/transport.js'
      - 'client/provider-postgrest.js'
      - 'tools/direct-sync.js'
      - 'db/migrations/**'
      - 'db/fixtures/migrations-86/**'
      - 'tests/tenant-121.js'
      - 'tests/gateway-bundle-120.js'
      - 'scripts/build-gateway-bundle.mjs'
      - 'deploy/gateway/**'
      - 'docs/cloud/120-gateway-bundle.md'
      - 'apps/owner-panel/server/**'
  pull_request:
    paths:
      - 'server/**'
      - 'openapi.yaml'
      - 'tools/openapi-drift-81.mjs'
      - 'tests/openapi-drift-81.js'
      - '.github/workflows/api-contract.yml'
      - 'docs/cloud/contracts/**'
      - 'tools/directory-client-66.mjs'
      - 'tools/cell-transfer-54.mjs'
      - 'tests/contract-vectors-64.js'
      - 'tests/native-contract-64.js'
      - 'tests/directory-66.js'
      - 'tests/cell-transfer-54.js'
      - 'tests/gateway-67.js'
      - 'tests/offline-119.js'
      - 'tests/field-crypto-87.js'
      - 'tools/field-rekey-87.mjs'
      - 'tests/load-82.js'
      - 'tools/load-82.mjs'
      - 'tests/fixtures/load-82-inject.cjs'
      - 'tests/load-82-direct.js'
      - 'tools/load-82-direct.mjs'
      - 'tests/migrations-86.js'
      - 'tools/migrate-86.mjs'
      - 'db/migrations/direct/**'
      - 'tests/direct-identity-106.js'
      - 'tests/e2e-keys-107.js'
      - 'tests/e2e1-107.js'
      - 'tools/e2e1.js'
      - 'tools/e2e1-vectors-107.mjs'
      - 'docs/cloud/contracts/e2e1-vectors-107.json'
      - 'tests/direct-sync-108.js'
      - 'tests/rls-pentest-109.js'
      - 'tests/telemetry-80.js'
      - 'client/telemetry.js'
      - 'tests/privacy-88.js'
      - 'tests/transport-110.js'
      - 'tools/backup-111.mjs'
      - 'tools/backup-drill-111.mjs'
      - 'client/transport.js'
      - 'client/provider-postgrest.js'
      - 'tools/direct-sync.js'
      - 'db/migrations/**'
      - 'db/fixtures/migrations-86/**'
      - 'tests/tenant-121.js'
      - 'tests/gateway-bundle-120.js'
      - 'scripts/build-gateway-bundle.mjs'
      - 'deploy/gateway/**'
      - 'docs/cloud/120-gateway-bundle.md'
      - 'apps/owner-panel/server/**'
  workflow_dispatch:
  # Row 95: called by release-gate.yml on the release commit (path filters do not apply).
  workflow_call:

permissions:
  contents: read

jobs:
  openapi-drift:
    name: OpenAPI drift gate (row 81)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Drift gate (code routes == openapi.yaml)
        run: node tools/openapi-drift-81.mjs

      - name: Gate negative controls
        run: node tests/openapi-drift-81.js

      - name: Validate OpenAPI 3 document
        run: |
          python3 -m venv "$RUNNER_TEMP/oa"
          "$RUNNER_TEMP/oa/bin/pip" install --quiet --disable-pip-version-check "openapi-spec-validator==0.9.0" "PyYAML==6.0.3"
          "$RUNNER_TEMP/oa/bin/python" - <<'PY'
          import yaml
          from openapi_spec_validator import validate
          d = yaml.safe_load(open('openapi.yaml', encoding='utf-8'))
          validate(d)
          ids = [op['operationId'] for p in d['paths'].values() for op in p.values()]
          assert len(ids) == len(set(ids)), 'duplicate operationId'
          print('OPENAPI-VALID paths=%d operations=%d' % (len(d['paths']), len(ids)))
          PY

  native-contract:
    name: Native API v1 conformance + Directory re-route + Gateway hardening (rows 64, 66, 67)
    runs-on: ubuntu-latest
    services:
      # Throwaway CI database; trust auth so tenancy.migrate can create the password-less
      # payesh_runtime LOGIN role exactly like tests/gateway-pg.js.
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: payesh_c64
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Shared conformance vectors (conflict, scope, version)
        run: node tests/contract-vectors-64.js | tee native-contract.txt
      - name: Every native endpoint vs JSON Schema (school server + Gateway/Directory on PostgreSQL)
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_c64
          PAYESH_PG_RUNTIME: postgres://payesh_runtime@127.0.0.1:5432/payesh_c64
        run: |
          set -o pipefail
          node --experimental-sqlite --disable-warning=ExperimentalWarning tests/native-contract-64.js | tee -a native-contract.txt
      - name: Directory bootstrap — school moved between two cells while the client writes
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/postgres
        run: |
          set -o pipefail
          node tests/directory-66.js | tee -a native-contract.txt
      - name: Row 54 transfer tool unit checks (sequence fix must not regress)
        run: node tests/cell-transfer-54.js | tee -a native-contract.txt
      - name: Row 67 Gateway hardening — SIGTERM drain, request-id, 429 Retry-After, kill-switches, short load test
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_c64
          PAYESH_PG_RUNTIME: postgres://payesh_runtime@127.0.0.1:5432/payesh_c64
          GW67_LOAD_OUT: gateway-67-load.json
        run: |
          set -o pipefail
          node tests/gateway-67.js | tee -a native-contract.txt
      # Row 119: the Gateway must survive PostgreSQL dropping its connections (unhandled pg.Pool
      # 'error' used to kill the process); web outbox transient/FIFO/exactly-once on the real Gateway.
      # Negative control: same Gateway with the pool 'error' handler stripped must crash.
      - name: Row 119 offline — Gateway survives DB drop, outbox transient/FIFO/exactly-once, mutants
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_c64
          PAYESH_PG_RUNTIME: postgres://payesh_runtime@127.0.0.1:5432/payesh_c64
          OFF119_REQUIRE_PG: '1'
        run: |
          set -o pipefail
          node tests/offline-119.js | tee -a native-contract.txt
      - name: Row 87 field encryption — AEAD at rest, env key, rotation, DB-dump negative test (SQLite + PostgreSQL), mutation controls
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_c64
          PAYESH_PG_RUNTIME: postgres://payesh_runtime@127.0.0.1:5432/payesh_c64
          FC87_REQUIRE_PG: '1'
        run: |
          set -o pipefail
          node --experimental-sqlite --disable-warning=ExperimentalWarning tests/field-crypto-87.js | tee -a native-contract.txt
      # Row 82: load + measurement [S]. 2,000 virtual devices / 20 tenants on the
      # real gateway + postgres:16. Gates: error rate <= 0.5%, p95 <= 1000 ms
      # (SLO 85), no RSS leak, every number labelled [S], no "unlimited" claim.
      # Negatives: injected leak / killed push / 1.2 s delay must turn the gates red.
      - name: Load test (row 82, [S] simulated)
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_c64
          PAYESH_PG_RUNTIME: postgres://payesh_runtime@127.0.0.1:5432/payesh_c64
          LOAD82_REQUIRE_PG: '1'
          LOAD82_OUT: load-82-report.json
        run: |
          set -o pipefail
          node tests/load-82.js | tee -a native-contract.txt
      # Row 82, direct path (ADR-105 Proposed): 2,000 devices / 20 schools call
      # sync_pull / sync_push with PostgREST transaction semantics (role without
      # BYPASSRLS) on postgres:16. Gates: error rate, p95, op integrity, session
      # leak, tenant isolation under load, labels. Negatives: tiny plan / sleep
      # trigger / open transaction / RLS mutant must turn the gates red. Plus the
      # finding of this row (migration 0006: InitPlan + tenant index condition).
      - name: Load test, direct path (row 82, [S] simulated)
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_c64
          LOAD82D_REQUIRE_PG: '1'
          LOAD82D_OUT: load-82-direct-report.json
        run: |
          set -o pipefail
          node tests/load-82-direct.js | tee -a native-contract.txt
      # Row 86: versioned zero-downtime migrations on the real postgres:16 service.
      # A fresh DB per run: product baseline adopts live data, the phone→mobile
      # drill runs expand/migrate under a concurrent N-1 writer (0 errors),
      # destructive SQL / contract without client floor / checksum drift /
      # second migrator / lock contention are all refused, 3 mutants killed.
      - name: Migrations gate (row 86, expand → migrate → contract on PG)
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_c64
          PAYESH_PG_RUNTIME: postgres://payesh_runtime@127.0.0.1:5432/payesh_c64
          MG86_REQUIRE_PG: '1'
        run: |
          set -o pipefail
          node tools/migrate-86.mjs lint
          node --experimental-sqlite --disable-warning=ExperimentalWarning tests/migrations-86.js | tee -a native-contract.txt
      # Row 106 (ADR-105 §3.1, Proposed): direct path without a Gateway — identity,
      # capabilities, user/device revocation and RLS inside PostgreSQL (standard SQL,
      # no provider extension). Revoked/disabled user, revoked/foreign device, other
      # role, other school ⇒ 0 rows; capabilities only via SECURITY DEFINER by the
      # school's manager; spoofed role/tenant claims ignored; 5 mutants caught.
      - name: Direct-path identity + RLS (row 106, real postgres:16)
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_c64
          DI106_REQUIRE_PG: '1'
        run: |
          set -o pipefail
          node tools/migrate-86.mjs lint --dir db/migrations/direct
          node tests/direct-identity-106.js | tee -a native-contract.txt
      # Row 107 (ADR-105 §3.2, Proposed): device-side end-to-end encryption on the direct
      # path. Library vs shared vectors (JS; Dart runs in native-client), then the database
      # half on postgres:16: no clear text in pg_dump/COPY (canary + positive control),
      # AAD swap detection, revocation ⇒ scope key rotation + re-encryption, 4 mutants.
      - name: Device-side encryption, key grants, rotation (row 107, real postgres:16)
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_c64
          E2E107_REQUIRE_PG: '1'
          E2E107_REQUIRE_PGDUMP: '1'
        run: |
          set -o pipefail
          node tools/e2e1-vectors-107.mjs --check
          node tests/e2e1-107.js | tee -a native-contract.txt
          node tests/e2e-keys-107.js | tee -a native-contract.txt
      # Row 108 (ADR-105 §3.3, Proposed): the Gateway's sync logic in SQL (sync_push /
      # sync_pull, change-feed, idempotency, plan quota by trigger, conflicts) on
      # postgres:16 — row-64 vectors + row-83 convergence (12 seeds), INVOKER + RLS,
      # repeat push = no effect, over-cap refused, 4 mutants, rollback to 0002.
      - name: Direct sync in SQL (row 108, real postgres:16)
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_c64
          DS108_REQUIRE_PG: '1'
        run: |
          set -o pipefail
          node --experimental-sqlite --disable-warning=ExperimentalWarning tests/direct-sync-108.js | tee -a native-contract.txt
      # Row 109 (ADR-105, Proposed): RLS / privilege attack suite on postgres:16 — other
      # tenant read/write, role escalation, capability tampering, internal functions,
      # no token, quota bypass F1..F5 (fixed by migration 0005); every control is
      # reverted by a mutant and its attack must then succeed. Row 108 is re-run on
      # top of 0005 (write tickets must not break the protocol). Both run on the
      # head migration (0007 since row 80: RLS InitPlan rewrite and telemetry change nothing).
      - name: RLS pentest (row 109, real postgres:16)
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_c64
          RP109_REQUIRE_PG: '1'
          DS108_REQUIRE_PG: '1'
          DS108_TO: 0007_direct_telemetry
          RLS109_TO: 0007_direct_telemetry
          DS108_RUNS: '4'
        run: |
          set -o pipefail
          node --experimental-sqlite --disable-warning=ExperimentalWarning tests/rls-pentest-109.js | tee -a native-contract.txt
          node --experimental-sqlite --disable-warning=ExperimentalWarning tests/direct-sync-108.js | tee -a native-contract.txt
      # Row 80: opt-in telemetry without PII on the direct path — one closed field
      # allowlist (schema = SQL = client), a PII field added anywhere ⇒ red (6 mutants),
      # consent + token identity, per-device / per-school rate limit, no direct table
      # access, end to end from client/telemetry.js, allowlist mutant, clean rollback.
      - name: Telemetry without PII (row 80, real postgres:16)
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_c64
          TM80_REQUIRE_PG: '1'
        run: |
          set -o pipefail
          node tests/telemetry-80.js | tee -a native-contract.txt
      # Row 88: privacy — export role allowlist (closed; guard refused), non-manager
      # exports scoped (row 38) and carrying no one else's national_id in ANY
      # collection, "my data" export, tombstone view (metadata only) + retention purge
      # (default 90 d, min 31), cross-school request refused (cross_tenant). Real
      # postgres:16 for the cloud product path; SQLite for the local school server.
      - name: Privacy delete/export (row 88, real postgres:16)
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_c64
          PV88_REQUIRE_PG: '1'
        run: |
          set -o pipefail
          node --experimental-sqlite --disable-warning=ExperimentalWarning tests/privacy-88.js | tee -a native-contract.txt
      # Row 110 (ADR-105, Proposed): direct transport of the JS client behind
      # PAYESH_TRANSPORT=direct (default off) — transport ↔ provider split, no service
      # key in client code (static scan, JS + Dart), offline outbox unchanged; real
      # postgres:16 behind a PostgREST-compatible emulator. The Dart side runs in
      # native-client (payesh_sync test/direct_transport_test.dart).
      - name: Direct transport (row 110, real postgres:16)
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_c64
          TR110_REQUIRE_PG: '1'
        run: |
          set -o pipefail
          node --experimental-sqlite --disable-warning=ExperimentalWarning tests/transport-110.js | tee -a native-contract.txt
      # Row 111 (ADR-105, Proposed): encrypted, timestamped pg_dump of the direct path
      # (X25519 + AES-256-GCM, streamed — no clear dump on disk) and the restore drill:
      # tamper/truncate/wrong-key refusals, restore into a BRAND-NEW cluster (initdb of
      # the runner's PostgreSQL, no roles), a device pulls + decrypts the restored copy,
      # RLS / idempotency / sequence intact, retention + freshness monitor. Label [S].
      - name: Backup + restore drill (row 111, real postgres:16 + fresh cluster)
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_c64
        run: |
          set -o pipefail
          PGB=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)
          test -x "$PGB/initdb" || { echo "no initdb on the runner"; exit 1; }
          pg_dump --version; psql --version
          PAYESH_PG_BIN="$PGB" node tools/backup-111.mjs drill --fresh-cluster | tee -a native-contract.txt
      # Row 121: owner panel creates a school → dedicated tenant → initial manager activates →
      # manager creates users in the same school → another school sees 0 rows (real Gateway,
      # fresh database, owner-panel migrations 001..005). Negative controls inline; the 8
      # mutants are recorded in docs/cloud/121-tenant-provisioning.md. Label [S].
      - name: Row 121 school creation → tenant → initial manager, cross-school 0 rows (real postgres:16)
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_c64
          PAYESH_PG_RUNTIME: postgres://payesh_runtime@127.0.0.1:5432/payesh_c64
          T121_REQUIRE_PG: '1'
        run: |
          set -o pipefail
          node tests/tenant-121.js | tee -a native-contract.txt
      # Row 120: multi-tenant Gateway bundle built, extracted OUTSIDE the repo and run against a
      # fresh postgres:16 database: admin migrate/logins/check, superuser refused (exit 3),
      # create-owner → TOTP login → plan → two schools → bundled selfcheck S01..S12 (isolation),
      # SIGTERM drain. 11 mutants inline. Label [S]; the real host is [M] (row 116).
      - name: Row 120 Gateway bundle → extracted → selfcheck on two schools (real postgres:16)
        env:
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_c64
          PAYESH_PG_RUNTIME: postgres://payesh_runtime@127.0.0.1:5432/payesh_c64
          T120_REQUIRE_PG: '1'
        run: |
          set -o pipefail
          node tests/gateway-bundle-120.js | tee -a native-contract.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-contract
          path: |
            native-contract.txt
            gateway-67-load.json
            load-82-report.json
            load-82-direct-report.json
