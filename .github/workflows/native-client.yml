name: native-client

# ═══════════════════════════════════════════════════════════════════
#  Native Payesh client — ADR-43 / D-43 · rows 63 + 69 + 70 + 71 + 72 + 73 + 75
#  One Flutter/Dart codebase → standalone Android APK/AAB + Windows EXE.
#  No WebView, no browser wrapper, no Node.js in the client bundle.
#
#  Rules (fail-closed):
#   · Flutter is pinned (version + archive sha256 + framework revision); a mismatch is red.
#   · pub get --enforce-lockfile, dart format, analyze with --fatal-infos (0 warnings/infos),
#     tests + line-coverage gate on every package.
#   · pubspec.lock must not contain any WebView / JS-engine package.
#   · Independent native gate (tools/native-independence-gate.mjs, criterion
#     docs/cloud/43-native-independence.json) runs on the REAL release output of this run:
#     app-release.apk, app-release.aab and the Windows Release folder. A "native" claim is
#     accepted only when this gate passes on these artifacts.
#   · Negative controls: the same gate must REJECT the shipped WebView/Node bundles
#     (the last published school WebView APK frozen in install/legacy-webview-fixtures/ and the
#     retired WebView owner APK + setup frozen in apps/owner-panel/legacy-webview-fixtures/,
#     both sha256-pinned; row 129 removed every WebView build from Release)
#     and the committed releases/payesh-local-windows-0.9.2.zip. If a control passes, the gate is broken → red.
#   · Rows 76/77: the APK/AAB are release-signed ONLY from GitHub Secrets (owner key, row 61);
#     without them they are debug-signed REHEARSAL builds, labelled NOT FOR DISTRIBUTION by
#     tools/android-release-check-76.mjs (targetSdk >= policy, not debuggable, v2/v3, permissions).
#     Windows: standard Inno Setup installer (apps/payesh/app/windows/installer/payesh-native.iss),
#     app-local MSVC runtime, silent install → row-63 gate on the INSTALLED app → uninstall;
#     Authenticode only with the optional PAYESH_WIN_PFX_* secrets. build.yml is untouched.
# ═══════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main, 'arena/**', 'hermes/**']
    paths:
      - 'apps/owner-panel/**'
      - 'db/migrations/owner-panel/**'
      - 'tools/owner-native-texts.mjs'
      - 'apps/payesh/**'
      - 'tools/native-independence-gate.mjs'
      - 'tools/android-release-check-76.mjs'
      - 'tests/android-release-76.js'
      - 'docs/cloud/76-android-release.json'
      - 'tests/native-gate-63.js'
      - 'tests/conformance-engine-70.js'
      - 'tests/conformance-outbox-71.js'
      - 'tests/conformance-jalali-73.js'
      - 'client/app.js'
      - 'client/import.js'
      - 'client/engine-web.js'
      - 'client/outbox-web.js'
      - 'server/sync.js'
      - 'server/gateway.js'
      - 'server/tenancy.js'
      - 'server/index.js'
      - 'server/auth.js'
      - 'server/identity.js'
      - 'install/windows/data-service/**'
      - 'docs/cloud/43-native-independence.json'
      - 'docs/cloud/contracts/conformance/**'
      - 'docs/cloud/contracts/e2e1-vectors-107.json'
      - 'docs/cloud/contracts/native-update-vectors-78.json'
      - 'tools/native-update-78.mjs'
      - 'tests/native-update-78.js'
      - '.github/workflows/native-client.yml'
  pull_request:
    paths:
      - 'apps/owner-panel/**'
      - 'db/migrations/owner-panel/**'
      - 'tools/owner-native-texts.mjs'
      - 'apps/payesh/**'
      - 'tools/native-independence-gate.mjs'
      - 'tools/android-release-check-76.mjs'
      - 'tests/android-release-76.js'
      - 'docs/cloud/76-android-release.json'
      - 'tests/native-gate-63.js'
      - 'tests/conformance-engine-70.js'
      - 'tests/conformance-outbox-71.js'
      - 'tests/conformance-jalali-73.js'
      - 'client/app.js'
      - 'client/import.js'
      - 'client/engine-web.js'
      - 'client/outbox-web.js'
      - 'server/sync.js'
      - 'server/gateway.js'
      - 'server/tenancy.js'
      - 'server/index.js'
      - 'server/auth.js'
      - 'server/identity.js'
      - 'install/windows/data-service/**'
      - 'docs/cloud/43-native-independence.json'
      - 'docs/cloud/contracts/conformance/**'
      - 'docs/cloud/contracts/e2e1-vectors-107.json'
      - 'docs/cloud/contracts/native-update-vectors-78.json'
      - 'tools/native-update-78.mjs'
      - 'tests/native-update-78.js'
      - '.github/workflows/native-client.yml'
  workflow_dispatch:
  # Row 95: the release gate (release-gate.yml) calls this workflow on the exact
  # release commit. Path filters do not apply under workflow_call, so a tag can
  # never skip the native build; every inner job result is exported below.
  workflow_call:
    outputs:
      results:
        description: 'inner job results, e.g. gate-controls=success,android=success,…'
        value: ${{ jobs.native-gate.outputs.results }}

permissions:
  contents: read

concurrency:
  # github.workflow is the CALLER under workflow_call — the release gate never cancels
  # (or is cancelled by) the ordinary push/PR run of the same ref.
  group: payesh-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  FLUTTER_REVISION: 'c197ca5199e9ee5661e865596c9c07294dfab51c'
  FLUTTER_LINUX_SHA256: '25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a'
  FLUTTER_WINDOWS_SHA256: 'd8e2b5977e09082c6440f89dc1aa887b94c8fbcc3b39222797046295a3f68a9e'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  COVERAGE_MIN: '80'

jobs:
  gate-controls:
    name: Native gate — self-test + negative controls (row 63)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate unit tests (synthetic clean/dirty APK, AAB, Windows bundles)
        run: node tests/native-gate-63.js
      - name: Android release check + installer wiring unit tests (rows 76/77)
        run: node tests/android-release-76.js
      - name: Frozen WebView/Node bundles (negative controls, sha256-pinned)
        run: |
          set -euo pipefail
          mkdir -p neg
          # row 129: no WebView build is published any more (continuous carries only the cloud
          # bundle + manifest). The last published school WebView APK is a committed,
          # sha256-pinned fixture; the Windows WebView control is the tracked release zip.
          (cd install/legacy-webview-fixtures && sha256sum -c SHA256SUMS)
          cp install/legacy-webview-fixtures/payesh-local.apk neg/payesh-local.apk
          # row 126: owner-continuous now carries the NATIVE owner app; the retired WebView
          # owner APK is a committed, sha256-pinned fixture (never published).
          (cd apps/owner-panel/legacy-webview-fixtures && sha256sum -c SHA256SUMS)
          cp apps/owner-panel/legacy-webview-fixtures/payesh-owner.apk neg/payesh-owner.apk
          ls -la neg
          sha256sum neg/* releases/payesh-local-windows-0.9.2.zip
      - name: Gate must REJECT every control (expect-fail)
        run: |
          set -euo pipefail
          node tools/native-independence-gate.mjs --expect-fail \
            --android neg/payesh-local.apk neg/payesh-owner.apk \
            --windows releases/payesh-local-windows-0.9.2.zip | tee native-gate-negative.txt
          grep -q 'NATIVE-GATE-NEGATIVE-CONTROL-OK' native-gate-negative.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-gate-negative-controls
          path: native-gate-negative.txt

  engine-web-conformance:
    name: Web parity — shared engine + outbox + Jalali vectors on the web client (rows 70/71/73)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Same vectors run against the Dart SQLite engine in the `dart` job
      # (apps/payesh/packages/payesh_data/test/conformance_test.dart).
      - name: engine-v1 vectors on client/engine-web.js (IndexedDB)
        run: node tests/conformance-engine-70.js
      # Same outbox vectors run against the Dart outbox (payesh_sync/test/outbox_conformance_test.dart).
      - name: outbox-v1 vectors on client/outbox-web.js (IndexedDB)
        run: node tests/conformance-outbox-71.js
      # Same Jalali vectors run against the Dart port (payesh_ui/test/jalali_conformance_test.dart).
      - name: jalali-v1 vectors regenerated from client/app.js + client/import.js must equal the committed file
        run: node tests/conformance-jalali-73.js
      # Row 78: signed native auto-update — JS reference + publisher tool on the same
      # vectors the Dart verifier runs (payesh_secure/test/native_update_test.dart).
      - name: native-update-78 — signed manifest, bad hash, downgrade, kill-switch vectors + mutants
        run: node tests/native-update-78.js

  sync-real-server:
    name: Dart sync client against the REAL Node server (row 71)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Flutter ${{ env.FLUTTER_VERSION }} (pinned, sha256-verified)
        run: |
          set -euo pipefail
          F="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$F" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$F"
          echo "${FLUTTER_LINUX_SHA256}  $RUNNER_TEMP/$F" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$F" -C "$RUNNER_TEMP"
          git config --global --add safe.directory "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: pub get (lockfile enforced)
        working-directory: apps/payesh
        run: flutter pub get --enforce-lockfile
      # server_it_test.dart spawns `node server/index.js` (fresh data dir), then:
      # offline push applied once, duplicate uid, pull into SQLite, bad token → queued,
      # server killed → op kept → restart → applied exactly once, per-op rejection.
      - name: payesh_sync ⇄ server/index.js
        working-directory: apps/payesh/packages/payesh_sync
        env:
          PAYESH_SERVER_IT: '1'
        run: |
          set -euo pipefail
          dart test --reporter expanded test/server_it_test.dart | tee "$GITHUB_WORKSPACE/sync-real-server.txt"
          # exactly 8 executed, none skipped (a skipped run prints "~N")
          grep -qE '\+8: All tests passed' "$GITHUB_WORKSPACE/sync-real-server.txt"
          if grep -qE '~[0-9]+' "$GITHUB_WORKSPACE/sync-real-server.txt"; then echo 'SYNC-IT-SKIPPED'; exit 1; fi
          echo SYNC-REAL-SERVER-OK
      # Row 127 — LAN mode: the app's LAN path (LanAccessClient → SyncClient/HttpSyncTransport →
      # AttendanceBook + SqliteOutbox → AutoSync) against server/index.js started as the headless
      # data service (PAYESH_HEADLESS=1): no web UI, setup only from loopback, phone+password login,
      # pull, offline queue → applied once, token rotation + replay revocation.
      - name: payesh_sync LAN mode ⇄ server/index.js headless (row 127)
        working-directory: apps/payesh/packages/payesh_sync
        env:
          PAYESH_SERVER_IT: '1'
        run: |
          set -euo pipefail
          dart test --reporter expanded test/lan_server_it_test.dart | tee "$GITHUB_WORKSPACE/lan-real-server.txt"
          grep -qE '\+7: All tests passed' "$GITHUB_WORKSPACE/lan-real-server.txt"
          if grep -qE '~[0-9]+' "$GITHUB_WORKSPACE/lan-real-server.txt"; then echo 'LAN-IT-SKIPPED'; exit 1; fi
          grep -qE '^NATIVE-LAN-IT passed=7 negative_controls=12$' "$GITHUB_WORKSPACE/lan-real-server.txt"
          echo LAN-REAL-SERVER-OK
      # Row 128 — the school-management pages (W6..W12: users, accounts, classes, schedule,
      # follow-up/import, reports, server admin) on the app's LAN path against the headless data
      # service: offline write → queued → applied; server-side refusals as negative controls.
      - name: payesh_sync school admin ⇄ server/index.js headless (row 128)
        working-directory: apps/payesh/packages/payesh_sync
        env:
          PAYESH_SERVER_IT: '1'
        run: |
          set -euo pipefail
          dart test --reporter expanded test/school_admin_it_test.dart | tee "$GITHUB_WORKSPACE/admin-real-server.txt"
          if grep -qE '~[0-9]+' "$GITHUB_WORKSPACE/admin-real-server.txt"; then echo 'ADMIN-IT-SKIPPED'; exit 1; fi
          ran=$(grep -oE '\+[0-9]+: All tests passed' "$GITHUB_WORKSPACE/admin-real-server.txt" | grep -oE '[0-9]+')
          # every test counted itself (passed=N equals the executed count) and negatives ran
          grep -qE "^NATIVE-ADMIN-IT passed=${ran} negative_controls=[1-9][0-9]*$" "$GITHUB_WORKSPACE/admin-real-server.txt"
          echo "ADMIN-REAL-SERVER-OK tests=${ran}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-real-server
          path: |
            sync-real-server.txt
            lan-real-server.txt
            admin-real-server.txt

  gateway-real:
    name: Dart Gateway client — pinned TLS against the REAL Gateway + PostgreSQL (row 75)
    runs-on: ubuntu-latest
    services:
      # Throwaway CI database. trust auth: tenancy.migrate creates the password-less
      # payesh_runtime LOGIN role exactly as in production-like tests (tests/gateway-pg.js).
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: payesh_gw75
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Flutter ${{ env.FLUTTER_VERSION }} (pinned, sha256-verified)
        run: |
          set -euo pipefail
          F="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$F" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$F"
          echo "${FLUTTER_LINUX_SHA256}  $RUNNER_TEMP/$F" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$F" -C "$RUNNER_TEMP"
          git config --global --add safe.directory "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: pub get (lockfile enforced)
        working-directory: apps/payesh
        run: flutter pub get --enforce-lockfile
      # gateway_it_test.dart: real server/gateway.js (runtime role, RLS) behind a TLS front with
      # a throwaway openssl CA. push applied once + duplicate, request-id/version/device headers
      # observed on the wire, paged pull into SQLite, tenant B isolation, real conflict verdict,
      # MITM (trusted CA, unpinned key) → refused with ZERO bytes sent, bad token → 401.
      - name: payesh_sync ⇄ server/gateway.js (pinned TLS)
        working-directory: apps/payesh/packages/payesh_sync
        env:
          PAYESH_GW_IT: '1'
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_gw75
          PAYESH_PG_RUNTIME: postgres://payesh_runtime@127.0.0.1:5432/payesh_gw75
        run: |
          set -euo pipefail
          command -v openssl
          dart test --reporter expanded test/gateway_it_test.dart test/pinning_test.dart test/data_path_test.dart test/school_access_it_test.dart test/attendance_it_test.dart test/grades_it_test.dart test/notices_it_test.dart test/family_it_test.dart | tee "$GITHUB_WORKSPACE/gateway-real.txt"
          if grep -qE '~[0-9]+' "$GITHUB_WORKSPACE/gateway-real.txt"; then echo 'GATEWAY-IT-SKIPPED'; exit 1; fi
          grep -qE '\+[0-9]+: All tests passed' "$GITHUB_WORKSPACE/gateway-real.txt"
          # row 74 wave 1: native school login against the real Directory + Gateway (7 scenarios)
          grep -qE 'NATIVE-WAVE1-IT passed=7 negative_controls=11' "$GITHUB_WORKSPACE/gateway-real.txt"
          # row 74 wave 2: native attendance — pull → local write → outbox → real Gateway (8 scenarios)
          grep -qE 'NATIVE-WAVE2-IT passed=8 negative_controls=9' "$GITHUB_WORKSPACE/gateway-real.txt"
          # row 74 wave 3: native grades — pull → local write → outbox → real Gateway, approval_denied (8 scenarios)
          grep -qE 'NATIVE-WAVE3-IT passed=8 negative_controls=10' "$GITHUB_WORKSPACE/gateway-real.txt"
          # row 74 wave 4: native notices — pull → local publish/edit/delete → outbox → real Gateway, role_denied (8 scenarios)
          grep -qE 'NATIVE-WAVE4-IT passed=8 negative_controls=8' "$GITHUB_WORKSPACE/gateway-real.txt"
          # row 74 wave 5: native parents pages — own family only, leave request offline → real Gateway, approval_denied (8 scenarios)
          grep -qE 'NATIVE-WAVE5-IT passed=8 negative_controls=9' "$GITHUB_WORKSPACE/gateway-real.txt"
          echo GATEWAY-REAL-OK
      # Row 119: 20 offline scenarios on the default data path (SqliteOutbox/AutoSync/GatewaySync
      # → real server/gateway.js → postgres:16). Real TCP faults in front of the Gateway AND of
      # PostgreSQL, Gateway SIGKILL/restart, app process SIGKILLed mid-request. Gate: no skip,
      # 20 PASS lines, data_loss=0 duplicate=0 order_violations=0 cross_tenant=0.
      - name: payesh_sync offline scenarios (row 119, real gateway + postgres)
        working-directory: apps/payesh/packages/payesh_sync
        env:
          PAYESH_OFFLINE_IT: '1'
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_gw75
          PAYESH_PG_RUNTIME: postgres://payesh_runtime@127.0.0.1:5432/payesh_gw75
        run: |
          set -euo pipefail
          dart test --reporter expanded test/offline_119_test.dart test/auto_sync_test.dart | tee "$GITHUB_WORKSPACE/offline-119.txt"
          if grep -qE '~[0-9]+' "$GITHUB_WORKSPACE/offline-119.txt"; then echo 'OFFLINE-119-SKIPPED'; exit 1; fi
          test "$(grep -cE '^PASS  O119-S[0-9]{2} ' "$GITHUB_WORKSPACE/offline-119.txt")" = 20
          grep -qE '^OFFLINE-119 scenarios=20 data_loss=0 duplicate=0 order_violations=0 cross_tenant=0$' "$GITHUB_WORKSPACE/offline-119.txt"
          echo OFFLINE-119-OK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-real
          path: |
            gateway-real.txt
            offline-119.txt

  dart:
    name: Flutter — pub get, format, analyze, test, coverage (row 69)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/payesh
    steps:
      - uses: actions/checkout@v4
      - name: Flutter ${{ env.FLUTTER_VERSION }} (pinned, sha256-verified)
        working-directory: .
        run: |
          set -euo pipefail
          F="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$F" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$F"
          echo "${FLUTTER_LINUX_SHA256}  $RUNNER_TEMP/$F" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$F" -C "$RUNNER_TEMP"
          git config --global --add safe.directory "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Verify framework revision
        run: |
          set -euo pipefail
          flutter config --no-analytics >/dev/null
          flutter --version --machine | tee "$RUNNER_TEMP/fv.json"
          grep -q "\"frameworkRevision\": \"${FLUTTER_REVISION}\"" "$RUNNER_TEMP/fv.json"
      - name: pub get (lockfile enforced)
        run: flutter pub get --enforce-lockfile
      - name: No WebView / JS-engine package in the dependency graph
        run: |
          set -euo pipefail
          if grep -nEi '^  (webview[a-z_]*|[a-z_]*_webview[a-z_]*|flutter_inappwebview[a-z_]*|flutter_js|flutter_qjs|nodejs[a-z_]*|capacitor[a-z_]*|cordova[a-z_]*):' pubspec.lock; then
            echo 'NATIVE-DEPS-FAIL a WebView/JS package is in pubspec.lock'; exit 1
          fi
          echo 'NATIVE-DEPS-OK'
      - name: dart format (no diff)
        run: dart format --output=none --set-exit-if-changed app/lib app/test owner/lib owner/test packages tool
      - name: analyze (0 errors, 0 warnings, 0 infos)
        run: |
          set -euo pipefail
          (cd app && flutter analyze --fatal-infos --fatal-warnings)
          (cd owner && flutter analyze --fatal-infos --fatal-warnings)
          for p in packages/*/; do
            if grep -q 'sdk: flutter' "$p/pubspec.yaml"; then (cd "$p" && flutter analyze --fatal-infos --fatal-warnings)
            else (cd "$p" && dart analyze --fatal-infos --fatal-warnings); fi
          done
          dart analyze --fatal-infos tool
      - name: tests + coverage
        run: |
          set -euo pipefail
          (cd app && flutter test --coverage)
          (cd owner && flutter test --coverage)
          # Flutter packages (payesh_ui: widgets + goldens with the bundled font) → flutter test
          for p in packages/*/; do
            if grep -q 'sdk: flutter' "$p/pubspec.yaml"; then (cd "$p" && flutter test --concurrency=1 --coverage)
            else (cd "$p" && dart run coverage:test_with_coverage); fi
          done
          dart tool/coverage_check.dart "$COVERAGE_MIN" app/coverage/lcov.info owner/coverage/lcov.info packages/*/coverage/lcov.info | tee coverage-summary.txt
      # Row 73: goldens rendered with the REAL Vazirmatn (light/dark × Android/Windows × text 2x),
      # RTL / Jalali / a11y widget tests and the web-generated Jalali vectors — must all execute.
      - name: payesh_ui goldens + RTL/Jalali/a11y (row 73, none skipped)
        working-directory: apps/payesh/packages/payesh_ui
        run: |
          set -euo pipefail
          flutter test --concurrency=1 --reporter expanded | tee "$GITHUB_WORKSPACE/ui-73.txt"
          if grep -qE '~[0-9]+' "$GITHUB_WORKSPACE/ui-73.txt"; then echo 'UI-TESTS-SKIPPED'; exit 1; fi
          test "$(grep -cE 'golden (android|windows)_' "$GITHUB_WORKSPACE/ui-73.txt")" -ge 5
          ls test/goldens/*.png | tee -a "$GITHUB_WORKSPACE/ui-73.txt"
          sha256sum test/goldens/*.png fonts/*.ttf | tee -a "$GITHUB_WORKSPACE/ui-73.txt"
          echo UI-73-OK | tee -a "$GITHUB_WORKSPACE/ui-73.txt"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: apps/payesh/packages/payesh_ui/test/failures/
      - uses: actions/upload-artifact@v4
        with:
          name: native-coverage
          path: |
            apps/payesh/coverage-summary.txt
            apps/payesh/app/coverage/lcov.info
            apps/payesh/owner/coverage/lcov.info
            apps/payesh/packages/*/coverage/lcov.info
            ui-73.txt

  android:
    name: Android release build + native gate on APK/AAB
    needs: dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Flutter ${{ env.FLUTTER_VERSION }} (pinned, sha256-verified)
        run: |
          set -euo pipefail
          F="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$F" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$F"
          echo "${FLUTTER_LINUX_SHA256}  $RUNNER_TEMP/$F" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$F" -C "$RUNNER_TEMP"
          git config --global --add safe.directory "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      # Row 76: release signing ONLY from GitHub Secrets (same owner key as row 61),
      # decoded into runner temp storage. Missing secrets ⇒ debug-signed REHEARSAL
      # build (labelled NOT FOR DISTRIBUTION); secrets present but invalid ⇒ red.
      - name: Release signing material from Secrets (row 76, no repo fallback)
        id: signing
        env:
          PAYESH_KEYSTORE_B64: ${{ secrets.PAYESH_KEYSTORE_B64 }}
          PAYESH_KEYSTORE_PASS: ${{ secrets.PAYESH_KEYSTORE_PASS }}
          PAYESH_KEY_ALIAS: ${{ secrets.PAYESH_KEY_ALIAS }}
          PAYESH_KEY_PASS: ${{ secrets.PAYESH_KEY_PASS }}
          PAYESH_SIGNING_ROTATION_APPROVED: ${{ vars.PAYESH_SIGNING_ROTATION_APPROVED }}
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          MISSING=""
          for name in PAYESH_KEYSTORE_B64 PAYESH_KEYSTORE_PASS PAYESH_KEY_ALIAS PAYESH_KEY_PASS; do
            if [ -z "${!name:-}" ]; then MISSING="$MISSING $name"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning title=Native APK not release-signed::missing secrets:$MISSING — debug-signed rehearsal build, NOT FOR DISTRIBUTION (owner key: row 61)"
            exit 0
          fi
          if [ "${PAYESH_SIGNING_ROTATION_APPROVED:-}" != "true" ]; then
            echo "::warning title=Native APK not release-signed::vars.PAYESH_SIGNING_ROTATION_APPROVED is not true — rehearsal build only"
            exit 0
          fi
          KS="$RUNNER_TEMP/payesh-native-signing.p12"
          printf '%s' "$PAYESH_KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          test -s "$KS"
          if ! keytool -list -keystore "$KS" -storetype PKCS12 -storepass:env PAYESH_KEYSTORE_PASS -alias "$PAYESH_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::keystore/alias from Secrets cannot be validated — fail-closed"
            exit 1
          fi
          printf 'PAYESH_KEYSTORE=%s\n' "$KS" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Fail-closed control — required release signing without a key must stop Gradle (row 76)
        working-directory: apps/payesh/app
        run: |
          set -uo pipefail
          flutter config --no-analytics >/dev/null
          flutter pub get --enforce-lockfile
          # the build MUST fail here; the runner shell is `bash -e`, so capture the exit code explicitly
          code=0
          env -u PAYESH_KEYSTORE -u PAYESH_KEYSTORE_PASS -u PAYESH_KEY_ALIAS -u PAYESH_KEY_PASS \
            PAYESH_NATIVE_REQUIRE_RELEASE_SIGNING=true flutter build apk --release > "$RUNNER_TEMP/require-signing.log" 2>&1 || code=$?
          grep -m1 'PAYESH-SIGNING-REQUIRED' "$RUNNER_TEMP/require-signing.log" || true
          if [ $code -eq 0 ] || ! grep -q 'PAYESH-SIGNING-REQUIRED' "$RUNNER_TEMP/require-signing.log"; then
            tail -30 "$RUNNER_TEMP/require-signing.log"
            echo "::error::Gradle built a release APK although signing was required and no key was given"
            exit 1
          fi
          echo "SIGNING-REQUIRED-CONTROL-OK (exit $code)"
      - name: Build APK + AAB (release)
        working-directory: apps/payesh/app
        env:
          PAYESH_KEYSTORE_PASS: ${{ steps.signing.outputs.ready == 'true' && secrets.PAYESH_KEYSTORE_PASS || '' }}
          PAYESH_KEY_ALIAS: ${{ steps.signing.outputs.ready == 'true' && secrets.PAYESH_KEY_ALIAS || '' }}
          PAYESH_KEY_PASS: ${{ steps.signing.outputs.ready == 'true' && secrets.PAYESH_KEY_PASS || '' }}
          PAYESH_NATIVE_REQUIRE_RELEASE_SIGNING: ${{ steps.signing.outputs.ready == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          flutter config --no-analytics >/dev/null
          flutter pub get --enforce-lockfile
          flutter build apk --release --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Native gate on the REAL APK/AAB
        run: |
          set -euo pipefail
          OUT=apps/payesh/app/build/app/outputs
          mkdir -p native-out
          cp "$OUT/flutter-apk/app-release.apk" native-out/payesh-native.apk
          cp "$OUT/bundle/release/app-release.aab" native-out/payesh-native.aab
          node tools/native-independence-gate.mjs --android native-out/payesh-native.apk native-out/payesh-native.aab | tee native-out/native-gate-android.txt
          grep -q '^NATIVE-GATE-OK' native-out/native-gate-android.txt
          (cd native-out && sha256sum payesh-native.apk payesh-native.aab | tee SHA256SUMS-android)
      # Row 76: targetSdk (Google Play), not debuggable, v2/v3 signature, permission
      # allowlist, owner certificate in release mode — read from the REAL APK/AAB.
      - name: Release check on the REAL APK/AAB (row 76)
        env:
          READY: ${{ steps.signing.outputs.ready }}
          PIN: ${{ vars.PAYESH_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/aapt2" dump badging native-out/payesh-native.apk > native-out/aapt2-badging.txt
          "$BT/apksigner" verify --verbose --print-certs native-out/payesh-native.apk > native-out/apksigner.txt 2>&1
          grep -E "^(Verif|Number of signers|.*certificate (DN|SHA-256))" native-out/apksigner.txt || true
          jarsigner -verify -certs native-out/payesh-native.aab > native-out/jarsigner-aab.txt 2>&1 || true
          MODE=rehearsal; [ "$READY" = "true" ] && MODE=release
          if [[ "$GITHUB_REF" == refs/tags/native-v* ]] && [ "$MODE" != release ]; then
            echo "::error::native release tag but no owner signing key (row 61) — a debug-signed APK is never released"
            exit 1
          fi
          node tools/android-release-check-76.mjs --badging native-out/aapt2-badging.txt --certs native-out/apksigner.txt \
            --aab-jarsigner native-out/jarsigner-aab.txt --mode "$MODE" ${PIN:+--expect-cert-sha256 "$PIN"} | tee native-out/android-release-76.txt
          grep -q '^ANDROID-RELEASE-76-OK' native-out/android-release-76.txt
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/payesh-native-signing.p12"
      # Row 72: the APK must carry the encrypting SQLite build (SQLite3 Multiple Ciphers) for
      # every ABI — never plain SQLite (the app refuses to open its database without it).
      - name: Encrypted SQLite is bundled in the APK (row 72)
        run: |
          set -euo pipefail
          mkdir -p /tmp/apkx && unzip -q -o native-out/payesh-native.apk 'lib/*' -d /tmp/apkx
          found=0
          for so in $(find /tmp/apkx/lib -name '*sqlite3*.so'); do
            v=$(grep -a -o -m1 'SQLite3 Multiple Ciphers [0-9.]*' "$so" | head -1 || true)
            echo "$(echo "$so" | sed 's#/tmp/apkx/##') sha256=$(sha256sum "$so" | cut -c1-64) ${v:-NO-CIPHER}"
            test -n "$v"
            found=$((found+1))
          done | tee native-out/sqlite-cipher-android.txt
          test "$(grep -c 'Multiple Ciphers' native-out/sqlite-cipher-android.txt)" -ge 1
          echo SQLITE-CIPHER-ANDROID-OK | tee -a native-out/sqlite-cipher-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-android
          path: native-out/

  windows:
    name: Windows release build + native gate on EXE bundle
    needs: dart
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Flutter ${{ env.FLUTTER_VERSION }} (pinned, sha256-verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $F = "flutter_windows_$($env:FLUTTER_VERSION)-stable.zip"
          $Z = Join-Path $env:RUNNER_TEMP $F
          Invoke-WebRequest -Uri "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/$F" -OutFile $Z
          $h = (Get-FileHash $Z -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:FLUTTER_WINDOWS_SHA256) { throw "flutter archive sha256 mismatch: $h" }
          tar -xf $Z -C $env:RUNNER_TEMP
          git config --global --add safe.directory '*'
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP 'flutter\bin')
      - name: Build Windows (release)
        shell: pwsh
        working-directory: apps/payesh/app
        run: |
          $ErrorActionPreference = 'Stop'
          flutter config --no-analytics | Out-Null
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'pub get failed' }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'flutter build windows failed' }
      # Row 77: the installer must run on a clean Windows without the VC++ redistributable,
      # so the MSVC runtime DLLs the binaries import are deployed app-locally (allowed by
      # the Visual Studio redistribution terms). Checked below with dumpbin on the INSTALLED app.
      - name: App-local MSVC runtime (row 77)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          # VS 2022 ships x64\Microsoft.VC143.CRT, VS 2026 (\18\) Microsoft.VC145.CRT; the folder list
          # also holds non-version names (e.g. v145) — take the newest numeric version that has a CRT.
          $redist = Join-Path $vs 'VC\Redist\MSVC'
          $src = $null
          foreach ($v in (Get-ChildItem $redist -Directory | Where-Object { $_.Name -match '^\d+(\.\d+)+$' } | Sort-Object { [version]$_.Name } -Descending)) {
            $c = Get-ChildItem (Join-Path $v.FullName 'x64') -Directory -Filter 'Microsoft.VC14*.CRT' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
            if ($c -and (Test-Path (Join-Path $c.FullName 'vcruntime140_1.dll'))) { $src = $c.FullName; break }
          }
          if (-not $src) { Get-ChildItem $redist | Format-Table Name | Out-String | Write-Host; throw "MSVC CRT redist (Microsoft.VC143.CRT / VC145) not found under $redist" }
          $rel = 'apps\payesh\app\build\windows\x64\runner\Release'
          foreach ($d in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item (Join-Path $src $d) $rel -Force
            "{0} <- {1}" -f $d, $src
          }
      # Row 72: real DPAPI (crypt32.dll) + encrypted SQLite on Windows — not a fake.
      - name: payesh_secure (REAL DPAPI) + payesh_data (SQLite3MC) tests on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location apps/payesh/packages/payesh_secure
          dart test --reporter expanded test/dpapi_windows_test.dart | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/dpapi-windows.txt"
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI tests failed' }
          Pop-Location
          $t = Get-Content "$env:GITHUB_WORKSPACE/dpapi-windows.txt" -Raw
          if ($t -notmatch '\+5: All tests passed') { throw 'expected exactly 5 DPAPI tests to pass' }
          if ($t -match '~[0-9]+') { throw 'DPAPI tests were skipped' }
          Push-Location apps/payesh/packages/payesh_data
          dart test --reporter expanded test/encrypted_database_test.dart | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/sqlcipher-windows.txt"
          if ($LASTEXITCODE -ne 0) { throw 'encrypted database tests failed on Windows' }
          Pop-Location
          'DPAPI-WINDOWS-OK' | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/dpapi-windows.txt" -Append
      - name: Encrypted SQLite is bundled in the Windows build (row 72)
        shell: bash
        run: |
          set -euo pipefail
          REL=apps/payesh/app/build/windows/x64/runner/Release
          mkdir -p native-out
          for d in $(find "$REL" -iname '*sqlite3*.dll'); do
            v=$(grep -a -o -m1 'SQLite3 Multiple Ciphers [0-9.]*' "$d" | head -1 || true)
            echo "$(basename "$d") sha256=$(sha256sum "$d" | cut -c1-64) ${v:-NO-CIPHER}"
            test -n "$v"
          done | tee native-out/sqlite-cipher-windows.txt
          grep -q 'Multiple Ciphers' native-out/sqlite-cipher-windows.txt
          cp dpapi-windows.txt sqlcipher-windows.txt native-out/
          echo SQLITE-CIPHER-WINDOWS-OK | tee -a native-out/sqlite-cipher-windows.txt
      - name: Native gate on the REAL Windows bundle
        shell: bash
        run: |
          set -euo pipefail
          REL=apps/payesh/app/build/windows/x64/runner/Release
          ls -la "$REL"
          mkdir -p native-out
          node tools/native-independence-gate.mjs --windows "$REL" | tee native-out/native-gate-windows.txt
          grep -q '^NATIVE-GATE-OK' native-out/native-gate-windows.txt
          (cd "$REL" && 7z a -tzip -r "$GITHUB_WORKSPACE/native-out/payesh-native-windows.zip" . >/dev/null)
          node tools/native-independence-gate.mjs --windows native-out/payesh-native-windows.zip | tee -a native-out/native-gate-windows.txt
          (cd native-out && sha256sum payesh-native-windows.zip | tee SHA256SUMS-windows)
      # ── Row 77: standard installer (Inno Setup) + optional Authenticode ─────────
      - name: Authenticode material (optional, only with Secrets)
        id: wsign
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.PAYESH_WIN_PFX_B64 }}
          PFX_PASS: ${{ secrets.PAYESH_WIN_PFX_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'
          "ready=false" >> $env:GITHUB_OUTPUT
          if (-not $env:PFX_B64 -or -not $env:PFX_PASS) {
            "::warning title=Native installer unsigned::PAYESH_WIN_PFX_B64/PASS not set — unsigned installer with SHA-256 (SmartScreen will warn)"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'payesh-native-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $st) { throw 'signtool.exe not found' }
          "SIGNTOOL=$($st.FullName)" >> $env:GITHUB_ENV
          "NATIVE_PFX=$pfx" >> $env:GITHUB_ENV
          "ready=true" >> $env:GITHUB_OUTPUT
      - name: Sign payesh_app.exe (only with Secrets)
        if: steps.wsign.outputs.ready == 'true'
        shell: pwsh
        env:
          PFX_PASS: ${{ secrets.PAYESH_WIN_PFX_PASS }}
        run: |
          & $env:SIGNTOOL sign /f $env:NATIVE_PFX /p $env:PFX_PASS /fd sha256 /tr http://timestamp.digicert.com /td sha256 'apps\payesh\app\build\windows\x64\runner\Release\payesh_app.exe'
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed — fail-closed' }
      - name: Build payesh-native-setup.exe (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y | Out-Null
          $iscc = @(Get-ChildItem 'C:\Program Files (x86)\Inno Setup*','C:\Program Files\Inno Setup*' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $iscc) { throw 'ISCC not found' }
          "ISCC: $iscc"
          $v = (Select-String -Path 'apps\payesh\app\pubspec.yaml' -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$v" 'apps\payesh\app\windows\installer\payesh-native.iss' 2>&1 | Tee-Object -FilePath native-out\iscc-native.log
          if ($LASTEXITCODE -ne 0) { Get-Content native-out\iscc-native.log -Tail 15; throw "ISCC failed ($LASTEXITCODE)" }
          $exe = 'native-out\payesh-native-setup.exe'
          if (-not (Test-Path $exe)) { throw 'payesh-native-setup.exe was not built' }
          "{0:N1} MB — version {1}" -f ((Get-Item $exe).Length/1MB), $v
      - name: Sign the installer (only with Secrets)
        if: steps.wsign.outputs.ready == 'true'
        shell: pwsh
        env:
          PFX_PASS: ${{ secrets.PAYESH_WIN_PFX_PASS }}
        run: |
          & $env:SIGNTOOL sign /f $env:NATIVE_PFX /p $env:PFX_PASS /fd sha256 /tr http://timestamp.digicert.com /td sha256 'native-out\payesh-native-setup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed — fail-closed' }
      - name: Silent install → native gate + MSVC imports on the INSTALLED app → silent uninstall (row 77)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Resolve-Path 'native-out\payesh-native-setup.exe'
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent install failed ($($p.ExitCode))" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\PayeshNative'
          foreach ($f in 'payesh_app.exe','flutter_windows.dll','data\icudtl.dat','data\app.so','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll','unins000.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" }
          }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{F022A94A-885F-4620-9730-3E5EF0086EBE}_is1'
          if (-not (Test-Path $key)) { throw 'uninstall key with the native AppId not found' }
          foreach ($other in '{7C4E2A51-9F3B-4E7A-9C21-5B8A1D3E6F02}','{20AE76FD-560D-41ED-B6F5-7F66F3308129}') {
            if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\${other}_is1") { throw "foreign AppId $other registered" }
          }
          "installed: $dir" | Tee-Object -FilePath native-out\installer-77.txt
          Get-ChildItem $dir -Recurse -File | ForEach-Object { "{0}`t{1}" -f $_.FullName.Substring($dir.Length+1), $_.Length } | Tee-Object -FilePath native-out\installer-77.txt -Append
          node tools/native-independence-gate.mjs --windows "$dir" | Tee-Object -FilePath native-out\installer-77.txt -Append
          if ($LASTEXITCODE -ne 0) { throw 'native gate (row 63) failed on the INSTALLED app' }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          $missing = @()
          foreach ($bin in Get-ChildItem $dir -Recurse -Include *.exe,*.dll | Where-Object { $_.Name -ne 'unins000.exe' }) {
            $deps = & $dumpbin.FullName /nologo /dependents $bin.FullName | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }
            "$($bin.Name) imports: $($deps -join ', ')" | Tee-Object -FilePath native-out\installer-77.txt -Append
            foreach ($d in $deps) {
              if ($d -match '^(msvcp|vcruntime|concrt|vccorlib)\d' -and -not (Test-Path (Join-Path $bin.DirectoryName $d))) { $missing += "$($bin.Name) -> $d" }
            }
          }
          if ($missing.Count) { throw "MSVC runtime not deployed app-locally: $($missing -join '; ')" }
          'MSVC-APP-LOCAL-OK' | Tee-Object -FilePath native-out\installer-77.txt -Append
          $u = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "silent uninstall failed ($($u.ExitCode))" }
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $dir 'payesh_app.exe')) { throw 'payesh_app.exe left behind after uninstall' }
          if (Test-Path $key) { throw 'uninstall key left behind' }
          'INSTALLER-77-OK install+gate+uninstall' | Tee-Object -FilePath native-out\installer-77.txt -Append
      # ── Row 127: optional school data service (API only) + app ⇄ INSTALLED service IT ──
      - name: Build payesh-data-service-setup.exe (API-only school server, no web UI) (row 127)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = @(Get-ChildItem 'C:\Program Files (x86)\Inno Setup*','C:\Program Files\Inno Setup*' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $iscc) { throw 'ISCC not found' }
          $stage = Join-Path $env:GITHUB_WORKSPACE 'service-stage'
          New-Item -ItemType Directory -Force -Path "$stage\server","$stage\client\lib","$stage\releases" | Out-Null
          # pinned node.exe, verified against the official SHASUMS256.txt
          $nv = 'v22.14.0'
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$nv/win-x64/node.exe" -OutFile "$stage\node.exe" -UseBasicParsing
          $sums = (Invoke-WebRequest -Uri "https://nodejs.org/dist/$nv/SHASUMS256.txt" -UseBasicParsing).Content
          $line = @($sums -split "`n" | Where-Object { $_ -match '\s+win-x64/node\.exe\s*$' })[0]
          if (-not $line) { throw 'win-x64/node.exe not in SHASUMS256.txt' }
          $want = ($line -split '\s+')[0].ToLower()
          $got = (Get-FileHash "$stage\node.exe" -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "node.exe sha256 mismatch: $got vs $want" }
          Copy-Item server\*.js "$stage\server\"
          Copy-Item client\lib\*.js "$stage\client\lib\"
          Copy-Item package.json $stage
          if (Test-Path releases\manifest.json) { Copy-Item releases\manifest.json "$stage\releases\" }
          $v = (Select-String -Path 'apps\payesh\app\pubspec.yaml' -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$v" "/DStageDir=$stage" 'install\windows\data-service\payesh-data-service.iss' 2>&1 | Tee-Object -FilePath native-out\iscc-data-service.log
          if ($LASTEXITCODE -ne 0) { Get-Content native-out\iscc-data-service.log -Tail 15; throw "ISCC failed ($LASTEXITCODE)" }
          if (-not (Test-Path 'native-out\payesh-data-service-setup.exe')) { throw 'payesh-data-service-setup.exe was not built' }
          # negative control: a staging folder that carries the web UI must be refused at build time
          $bad = Join-Path $env:RUNNER_TEMP 'bad-service-stage'
          Copy-Item $stage $bad -Recurse
          Set-Content -Path "$bad\client\index.html" -Value '<html></html>'
          & $iscc "/DAppVersion=$v" "/DStageDir=$bad" "/O$env:RUNNER_TEMP\bad-out" 'install\windows\data-service\payesh-data-service.iss' *> $null
          if ($LASTEXITCODE -eq 0) { throw 'ISCC accepted a data-service stage that ships client\index.html' }
          $global:LASTEXITCODE = 0
          'DATA-SERVICE-NO-WEBUI-CONTROL-OK' | Tee-Object -FilePath native-out\data-service-127.txt
          $h = (Get-FileHash 'native-out\payesh-data-service-setup.exe' -Algorithm SHA256).Hash.ToLower()
          "$h  payesh-data-service-setup.exe" | Tee-Object -FilePath native-out\SHA256SUMS-data-service
      - name: Silent install of the data service → app LAN IT against the INSTALLED service → uninstall (row 127)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = 'native-out\data-service-127.txt'
          $p = Start-Process -FilePath (Resolve-Path 'native-out\payesh-data-service-setup.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent install failed ($($p.ExitCode))" }
          $dir = Join-Path $env:ProgramFiles 'PayeshDataService'
          foreach ($f in 'node.exe','server\start.js','server\index.js','payesh-service.cmd','unins000.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" }
          }
          # NEG: no web UI and no browser engine on disk
          foreach ($f in 'client\index.html','client\app.js','client\styles.css','WebView2Loader.dll','desktop') {
            if (Test-Path (Join-Path $dir $f)) { throw "data service ships $f" }
          }
          $task = Get-ScheduledTask -TaskName PayeshDataService
          "task: user=$($task.Principal.UserId) limit=$($task.Settings.ExecutionTimeLimit) trigger=$($task.Triggers[0].CimClass.CimClassName) action=$($task.Actions[0].Execute)" | Tee-Object -FilePath $log -Append
          if ($task.Principal.UserId -notmatch 'SYSTEM') { throw 'scheduled task does not run as SYSTEM' }
          if ($task.Settings.ExecutionTimeLimit -ne 'PT0S') { throw "scheduled task has a time limit ($($task.Settings.ExecutionTimeLimit)) — the service would be stopped" }
          if ($task.Triggers[0].CimClass.CimClassName -ne 'MSFT_TaskBootTrigger') { throw 'scheduled task is not a boot trigger' }
          $fw = netsh advfirewall firewall show rule name=PayeshDataService | Out-String
          if ($fw -notmatch '8080') { throw 'firewall rule for 8080 missing' }
          # the service runs in the background (task started by the installer)
          $ok = $false
          for ($i = 0; $i -lt 120 -and -not $ok; $i++) {
            try { $h = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/api/health' -TimeoutSec 2; $ok = ($h.ok -and $h.headless -and $h.name -eq 'payesh-local') } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { Get-Content "$env:ProgramData\Payesh\data\server.log" -Tail 30 -ErrorAction SilentlyContinue; throw 'installed data service did not answer /api/health (headless)' }
          "health: headless=$($h.headless) setup_done=$($h.setup_done) version=$($h.version)" | Tee-Object -FilePath $log -Append
          $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8080/' -SkipHttpErrorCheck -UseBasicParsing
          if ($r.StatusCode -ne 404 -or $r.Content -notmatch 'no_web_ui') { throw "installed service served a page at / ($($r.StatusCode))" }
          'NO-WEB-UI-OK' | Tee-Object -FilePath $log -Append
          # the native app's LAN path (same Dart code as the app) against the INSTALLED service
          Push-Location apps\payesh\packages\payesh_sync
          $env:PAYESH_SERVER_IT = '1'
          $env:PAYESH_LAN_IT_URL = 'http://127.0.0.1:8080'
          dart test --reporter expanded test/lan_server_it_test.dart 2>&1 | Tee-Object -FilePath (Join-Path $env:GITHUB_WORKSPACE 'native-out\lan-installed-it.txt')
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { throw "LAN IT against the installed service failed ($rc)" }
          $it = Get-Content native-out\lan-installed-it.txt -Raw
          if ($it -notmatch '\+7: All tests passed' -or $it -match '~[0-9]+') { throw 'LAN IT against the installed service: not 7/7 executed' }
          if ($it -notmatch 'NATIVE-LAN-IT passed=7 negative_controls=12') { throw 'LAN IT marker missing' }
          'NATIVE-LAN-INSTALLED-IT-OK passed=7' | Tee-Object -FilePath $log -Append
          # the data service is NOT a native UI program: the native gate must reject it (honest label)
          node tools/native-independence-gate.mjs --windows "$dir" --expect-fail | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw 'native gate did not reject the data service (node.exe) — it must never be labelled native' }
          $u = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "silent uninstall failed ($($u.ExitCode))" }
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $dir 'node.exe')) { throw 'node.exe left behind after uninstall' }
          if (Get-ScheduledTask -TaskName PayeshDataService -ErrorAction SilentlyContinue) { throw 'scheduled task left behind after uninstall' }
          if (-not (Test-Path "$env:ProgramData\Payesh\data\payesh.sqlite")) { throw 'school data was not kept on uninstall' }
          'DATA-SERVICE-127-OK install+headless+lan-it+uninstall(data kept)' | Tee-Object -FilePath $log -Append
      - name: Authenticode state + SHA-256 (row 77)
        shell: pwsh
        env:
          READY: ${{ steps.wsign.outputs.ready }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in 'native-out\payesh-native-setup.exe','apps\payesh\app\build\windows\x64\runner\Release\payesh_app.exe') {
            $s = Get-AuthenticodeSignature $f
            "$f — $($s.Status)" | Tee-Object -FilePath native-out\installer-77.txt -Append
            if ($env:READY -eq 'true' -and $s.Status -ne 'Valid') { throw "signature of $f is not valid ($($s.Status)) — fail-closed" }
            if ($env:READY -ne 'true' -and $s.Status -ne 'NotSigned') { throw "without Secrets $f must be unsigned ($($s.Status))" }
          }
          $h = (Get-FileHash 'native-out\payesh-native-setup.exe' -Algorithm SHA256).Hash.ToLower()
          "$h  payesh-native-setup.exe" | Tee-Object -FilePath native-out\SHA256SUMS-installer
      - name: Remove signing material
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'payesh-native-sign.pfx') -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: native-out/

  # ── Row 126: NATIVE owner panel (apps/payesh/owner) ──────────────────────────
  # The Dart owner client against the REAL owner stack: Gateway + platform API +
  # owner-panel server + migrations 001..006 on PGlite (apps/owner-panel/scripts/
  # native-it-harness.js), password + real TOTP, every page's endpoints, four-eyes
  # deletion, operator 403s, grants, infra two-step changes, audit hash chain.
  # Parity: the Persian error texts / pages / roles / CAPS equal web/app.js.
  owner-native-it:
    name: Native owner client against the REAL owner stack (row 126)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: Flutter ${{ env.FLUTTER_VERSION }} (pinned, sha256-verified)
        run: |
          set -euo pipefail
          F="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$F" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$F"
          echo "${FLUTTER_LINUX_SHA256}  $RUNNER_TEMP/$F" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$F" -C "$RUNNER_TEMP"
          git config --global --add safe.directory "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: pub get (lockfile enforced)
        working-directory: apps/payesh
        run: |
          flutter config --no-analytics >/dev/null
          flutter pub get --enforce-lockfile
      - name: payesh_owner_api ⇄ real Gateway + platform API (PGlite) + parity with web/app.js
        working-directory: apps/payesh/packages/payesh_owner_api
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/owner-out"
          PAYESH_OWNER_IT=1 dart test --reporter expanded test/real_server_it_test.dart test/parity_test.dart 2>&1 | tee "$GITHUB_WORKSPACE/owner-out/owner-native-it.txt"
          grep -q '^OWNER-NATIVE-IT-OK' "$GITHUB_WORKSPACE/owner-out/owner-native-it.txt"
          if grep -qE '~[0-9]+' "$GITHUB_WORKSPACE/owner-out/owner-native-it.txt"; then echo 'OWNER-IT-SKIPPED'; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-native-it
          path: owner-out/

  owner-android:
    name: Native owner panel — Android APK (ir.payesh.owner) + native gate
    needs: dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Flutter ${{ env.FLUTTER_VERSION }} (pinned, sha256-verified)
        run: |
          set -euo pipefail
          F="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$F" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$F"
          echo "${FLUTTER_LINUX_SHA256}  $RUNNER_TEMP/$F" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$F" -C "$RUNNER_TEMP"
          git config --global --add safe.directory "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      # Same owner key as the retired WebView APK (ADR-62, GitHub Secrets PAYESH_OWNER_*):
      # the native APK upgrades an installed WebView panel in place. Missing ⇒ debug-signed
      # rehearsal (never published); present but invalid ⇒ red.
      - name: Owner signing material from Secrets
        id: signing
        env:
          KS_B64: ${{ secrets.PAYESH_OWNER_KEYSTORE_B64 }}
          PAYESH_OWNER_KEYSTORE_PASS: ${{ secrets.PAYESH_OWNER_KEYSTORE_PASS }}
          PAYESH_OWNER_KEY_ALIAS: ${{ secrets.PAYESH_OWNER_KEY_ALIAS }}
          PAYESH_OWNER_KEY_PASS: ${{ secrets.PAYESH_OWNER_KEY_PASS }}
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ -z "${KS_B64:-}" ] || [ -z "${PAYESH_OWNER_KEYSTORE_PASS:-}" ] || [ -z "${PAYESH_OWNER_KEY_ALIAS:-}" ] || [ -z "${PAYESH_OWNER_KEY_PASS:-}" ]; then
            echo "::warning title=Owner APK not release-signed::PAYESH_OWNER_* secrets missing — debug-signed rehearsal, NOT FOR DISTRIBUTION"
            exit 0
          fi
          KS="$RUNNER_TEMP/payesh-owner-native.p12"
          printf '%s' "$KS_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          if ! keytool -list -keystore "$KS" -storetype PKCS12 -storepass:env PAYESH_OWNER_KEYSTORE_PASS -alias "$PAYESH_OWNER_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::owner keystore/alias from Secrets cannot be validated — fail-closed"; exit 1
          fi
          printf 'PAYESH_OWNER_KEYSTORE=%s\n' "$KS" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Fail-closed control — required owner signing without a key must stop Gradle
        working-directory: apps/payesh/owner
        run: |
          set -uo pipefail
          flutter config --no-analytics >/dev/null
          flutter pub get --enforce-lockfile
          code=0
          env -u PAYESH_OWNER_KEYSTORE -u PAYESH_OWNER_KEYSTORE_PASS -u PAYESH_OWNER_KEY_ALIAS -u PAYESH_OWNER_KEY_PASS \
            PAYESH_OWNER_REQUIRE_RELEASE_SIGNING=true flutter build apk --release > "$RUNNER_TEMP/owner-require.log" 2>&1 || code=$?
          if [ $code -eq 0 ] || ! grep -q 'PAYESH-OWNER-SIGNING-REQUIRED' "$RUNNER_TEMP/owner-require.log"; then
            tail -30 "$RUNNER_TEMP/owner-require.log"; echo "::error::owner APK built without the required key"; exit 1
          fi
          echo "OWNER-SIGNING-REQUIRED-CONTROL-OK (exit $code)"
      - name: Build owner APK + AAB (release)
        working-directory: apps/payesh/owner
        env:
          PAYESH_OWNER_KEYSTORE_PASS: ${{ steps.signing.outputs.ready == 'true' && secrets.PAYESH_OWNER_KEYSTORE_PASS || '' }}
          PAYESH_OWNER_KEY_ALIAS: ${{ steps.signing.outputs.ready == 'true' && secrets.PAYESH_OWNER_KEY_ALIAS || '' }}
          PAYESH_OWNER_KEY_PASS: ${{ steps.signing.outputs.ready == 'true' && secrets.PAYESH_OWNER_KEY_PASS || '' }}
          PAYESH_OWNER_REQUIRE_RELEASE_SIGNING: ${{ steps.signing.outputs.ready == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          # 100000+run: always above every WebView owner build (versionCode = run_number)
          BN=$((100000 + ${{ github.run_number }}))
          flutter build apk --release --build-number=$BN
          flutter build appbundle --release --build-number=$BN
      - name: Native gate + identity + signature on the REAL owner APK/AAB
        env:
          READY: ${{ steps.signing.outputs.ready }}
        run: |
          set -euo pipefail
          OUT=apps/payesh/owner/build/app/outputs
          mkdir -p owner-out
          cp "$OUT/flutter-apk/app-release.apk" owner-out/payesh-owner.apk
          cp "$OUT/bundle/release/app-release.aab" owner-out/payesh-owner.aab
          node tools/native-independence-gate.mjs --android owner-out/payesh-owner.apk owner-out/payesh-owner.aab | tee owner-out/native-gate-owner-android.txt
          grep -q '^NATIVE-GATE-OK' owner-out/native-gate-owner-android.txt
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging owner-out/payesh-owner.apk > owner-out/aapt2-badging.txt
          grep -q "^package: name='ir.payesh.owner'" owner-out/aapt2-badging.txt
          if grep -q 'application-debuggable' owner-out/aapt2-badging.txt; then echo '::error::debuggable owner APK'; exit 1; fi
          grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label)" owner-out/aapt2-badging.txt
          if grep -E "uses-permission: name='" owner-out/aapt2-badging.txt | grep -vE "android.permission.INTERNET|DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"; then
            echo '::error::unexpected permission in the owner APK'; exit 1
          fi
          "$BT/apksigner" verify --verbose --print-certs owner-out/payesh-owner.apk > owner-out/apksigner.txt 2>&1
          grep -E "^(Verif|Number of signers|.*certificate (DN|SHA-256))" owner-out/apksigner.txt
          if [ "$READY" = true ] && grep -q 'CN=Android Debug' owner-out/apksigner.txt; then echo '::error::owner key ready but APK debug-signed'; exit 1; fi
          if [ "$READY" != true ]; then echo 'REHEARSAL (debug-signed) — NOT FOR DISTRIBUTION' | tee owner-out/NOT-FOR-DISTRIBUTION.txt; fi
          (cd owner-out && sha256sum payesh-owner.apk payesh-owner.aab | tee SHA256SUMS-owner-android)
      # Row 126: owners already have the WebView APK installed. Android upgrades in place only
      # with the SAME signer certificate and a HIGHER versionCode — proven against the frozen
      # WebView APK (apps/owner-panel/legacy-webview-fixtures, sha256-pinned).
      - name: In-place upgrade over the retired WebView APK — same signer, higher versionCode
        env:
          READY: ${{ steps.signing.outputs.ready }}
        run: |
          set -euo pipefail
          FX=apps/owner-panel/legacy-webview-fixtures
          (cd "$FX" && sha256sum -c SHA256SUMS)
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$FX/payesh-owner.apk" | grep '^package:' | tee owner-out/legacy-badging.txt
          grep -q "^package: name='ir.payesh.owner'" owner-out/legacy-badging.txt
          OLD=$(sed -n "s/^package: .* versionCode='\([0-9]*\)'.*/\1/p" owner-out/legacy-badging.txt)
          NEW=$(sed -n "s/^package: .* versionCode='\([0-9]*\)'.*/\1/p" owner-out/aapt2-badging.txt)
          echo "versionCode webview=$OLD native=$NEW"
          if [ -z "$OLD" ] || [ -z "$NEW" ] || [ "$NEW" -le "$OLD" ]; then echo '::error::native versionCode must be above the WebView APK'; exit 1; fi
          digest() { grep -E 'certificate SHA-256 digest:' | sed 's/.*digest: //' | sort -u; }
          OLDC=$("$BT/apksigner" verify --verbose --print-certs "$FX/payesh-owner.apk" 2>&1 | digest)
          NEWC=$(digest < owner-out/apksigner.txt)
          echo "signer webview=$OLDC"; echo "signer native=$NEWC"
          if [ -z "$OLDC" ] || [ "$(printf '%s\n' "$OLDC" | wc -l)" -ne 1 ]; then echo '::error::cannot read a single signer from the WebView APK'; exit 1; fi
          if [ "$READY" = true ]; then
            if [ "$OLDC" != "$NEWC" ]; then echo '::error::native APK signer differs from the WebView APK — Android would refuse the in-place upgrade'; exit 1; fi
            echo "OWNER-ANDROID-UPGRADE-OK same-signer versionCode $OLD->$NEW" | tee owner-out/upgrade-android.txt
          else
            echo 'REHEARSAL: debug-signed, signer check not applicable, never published' | tee owner-out/upgrade-android.txt
          fi
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/payesh-owner-native.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: owner-native-android
          path: owner-out/

  owner-windows:
    name: Native owner panel — Windows EXE + installer (upgrade over the WebView shell) + native gate
    needs: dart
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Flutter ${{ env.FLUTTER_VERSION }} (pinned, sha256-verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $F = "flutter_windows_$($env:FLUTTER_VERSION)-stable.zip"
          $Z = Join-Path $env:RUNNER_TEMP $F
          Invoke-WebRequest -Uri "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/$F" -OutFile $Z
          $h = (Get-FileHash $Z -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:FLUTTER_WINDOWS_SHA256) { throw "flutter archive sha256 mismatch: $h" }
          tar -xf $Z -C $env:RUNNER_TEMP
          git config --global --add safe.directory '*'
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP 'flutter\bin')
      - name: Build owner Windows (release) + app-local MSVC runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location apps/payesh/owner
          flutter config --no-analytics | Out-Null
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'pub get failed' }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'flutter build windows failed' }
          Pop-Location
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $redist = Join-Path $vs 'VC\Redist\MSVC'
          $src = $null
          foreach ($v in (Get-ChildItem $redist -Directory | Where-Object { $_.Name -match '^\d+(\.\d+)+$' } | Sort-Object { [version]$_.Name } -Descending)) {
            $c = Get-ChildItem (Join-Path $v.FullName 'x64') -Directory -Filter 'Microsoft.VC14*.CRT' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
            if ($c -and (Test-Path (Join-Path $c.FullName 'vcruntime140_1.dll'))) { $src = $c.FullName; break }
          }
          if (-not $src) { throw "MSVC CRT redist not found under $redist" }
          foreach ($d in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') { Copy-Item (Join-Path $src $d) 'apps\payesh\owner\build\windows\x64\runner\Release' -Force }
      - name: Native gate on the REAL owner Windows bundle
        shell: bash
        run: |
          set -euo pipefail
          REL=apps/payesh/owner/build/windows/x64/runner/Release
          mkdir -p owner-out
          ls -la "$REL"
          node tools/native-independence-gate.mjs --windows "$REL" | tee owner-out/native-gate-owner-windows.txt
          grep -q '^NATIVE-GATE-OK' owner-out/native-gate-owner-windows.txt
          (cd "$REL" && 7z a -tzip -r "$GITHUB_WORKSPACE/owner-out/payesh-owner-windows.zip" . >/dev/null)
          node tools/native-independence-gate.mjs --windows owner-out/payesh-owner-windows.zip | tee -a owner-out/native-gate-owner-windows.txt
      - name: Build payesh-owner-setup.exe (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y | Out-Null
          $iscc = @(Get-ChildItem 'C:\Program Files (x86)\Inno Setup*','C:\Program Files\Inno Setup*' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $iscc) { throw 'ISCC not found' }
          $v = (Select-String -Path 'apps\payesh\owner\pubspec.yaml' -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force native-out | Out-Null
          & $iscc "/DAppVersion=$v" 'apps\payesh\owner\windows\installer\payesh-owner-native.iss' 2>&1 | Tee-Object -FilePath owner-out\iscc-owner.log
          if ($LASTEXITCODE -ne 0) { Get-Content owner-out\iscc-owner.log -Tail 15; throw "ISCC failed ($LASTEXITCODE)" }
          Move-Item native-out\payesh-owner-setup.exe owner-out\payesh-owner-setup.exe -Force
          "{0:N1} MB — version {1}" -f ((Get-Item owner-out\payesh-owner-setup.exe).Length/1MB), $v
      # Upgrade path (row 126, fail-closed): install the frozen WebView2 owner shell first
      # (apps/owner-panel/legacy-webview-fixtures, sha256-pinned — owner-continuous now carries the
      # native app). The native gate must REJECT that installed WebView folder; then the native
      # installer upgrades it in place: WebView2 files gone, remembered server address kept, and
      # the native gate must PASS on the INSTALLED folder.
      - name: Upgrade over the WebView shell → native gate on the INSTALLED app → run → uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = 'owner-out\installer-owner.txt'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\PayeshOwner'
          $data = Join-Path $env:LOCALAPPDATA 'PayeshOwner'
          $fx = 'apps\owner-panel\legacy-webview-fixtures'
          $want = ((Get-Content (Join-Path $fx 'SHA256SUMS')) | Where-Object { $_ -match '  payesh-owner-setup\.exe$' }) -replace '  .*$',''
          $got = (Get-FileHash (Join-Path $fx 'payesh-owner-setup.exe') -Algorithm SHA256).Hash.ToLower()
          if (-not $want -or $got -ne $want) { throw "WebView fixture sha256 mismatch: $got" }
          $p = Start-Process (Join-Path $fx 'payesh-owner-setup.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WebView owner install failed ($($p.ExitCode))" }
          $legacy = Test-Path (Join-Path $dir 'WebView2Loader.dll')
          if (-not $legacy) { throw 'the WebView owner shell did not install — the upgrade path is not exercised' }
          "WebView owner shell installed first (fixture sha256 $got)" | Tee-Object -FilePath $log -Append
          node tools/native-independence-gate.mjs --expect-fail --windows "$dir" | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw 'native gate did NOT reject the installed WebView owner shell' }
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content -Path (Join-Path $data 'origin.txt') -Value 'https://owner.example.ir' -NoNewline -Encoding ascii
          $p = Start-Process owner-out\payesh-owner-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "native owner install failed ($($p.ExitCode))" }
          foreach ($f in 'payesh_owner.exe','flutter_windows.dll','data\icudtl.dat','data\app.so','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll','unins000.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" }
          }
          foreach ($f in 'PayeshOwner.exe','WebView2Loader.dll','Microsoft.Web.WebView2.Core.dll','Microsoft.Web.WebView2.WinForms.dll') {
            if (Test-Path (Join-Path $dir $f)) { throw "WebView shell file left after the native install: $f" }
          }
          if ((Get-Content (Join-Path $data 'origin.txt') -Raw) -ne 'https://owner.example.ir') { throw 'remembered server address lost' }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{20AE76FD-560D-41ED-B6F5-7F66F3308129}_is1'
          if (-not (Test-Path $key)) { throw 'owner uninstall key not found' }
          if ((Get-ItemProperty $key).DisplayIcon -notmatch 'payesh_owner\.exe') { throw 'uninstall entry does not point at the native exe' }
          Get-ChildItem $dir -Recurse -File | ForEach-Object { "{0}`t{1}" -f $_.FullName.Substring($dir.Length+1), $_.Length } | Tee-Object -FilePath $log -Append
          node tools/native-independence-gate.mjs --windows "$dir" | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw 'native gate failed on the INSTALLED owner app' }
          # run: the native window must come up and stay alive (no browser engine, no server)
          $app = Start-Process (Join-Path $dir 'payesh_owner.exe') -PassThru
          Start-Sleep -Seconds 12
          $app.Refresh()
          if ($app.HasExited) { throw "payesh_owner.exe exited early ($($app.ExitCode))" }
          $mods = (Get-Process -Id $app.Id).Modules | ForEach-Object { $_.ModuleName }
          "loaded modules: $($mods -join ', ')" | Tee-Object -FilePath $log -Append
          foreach ($bad in 'WebView2Loader.dll','EmbeddedBrowserWebView.dll','msedgewebview2.exe','node.exe') {
            if ($mods -contains $bad) { throw "browser/runtime module loaded: $bad" }
          }
          if (Get-Process -Name msedgewebview2 -ErrorAction SilentlyContinue | Where-Object { $_.Parent.Id -eq $app.Id }) { throw 'WebView2 child process' }
          if ($mods -notcontains 'flutter_windows.dll') { throw 'flutter engine not loaded' }
          "RUN-OK pid=$($app.Id) title=$($app.MainWindowTitle)" | Tee-Object -FilePath $log -Append
          Stop-Process -Id $app.Id -Force
          $u = Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "silent uninstall failed ($($u.ExitCode))" }
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $dir 'payesh_owner.exe')) { throw 'payesh_owner.exe left after uninstall' }
          "OWNER-INSTALLER-OK upgrade-from-webview=$legacy install+gate+run+uninstall" | Tee-Object -FilePath $log -Append
          $h = (Get-FileHash 'owner-out\payesh-owner-setup.exe' -Algorithm SHA256).Hash.ToLower()
          "$h  payesh-owner-setup.exe" | Tee-Object -FilePath owner-out\SHA256SUMS-owner-installer
      - uses: actions/upload-artifact@v4
        with:
          name: owner-native-windows
          path: owner-out/

  native-gate:
    name: native-gate (all must pass)
    needs: [gate-controls, engine-web-conformance, sync-real-server, gateway-real, dart, android, windows, owner-native-it, owner-android, owner-windows]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      results: ${{ steps.verdict.outputs.results }}
    steps:
      - name: Verdict
        id: verdict
        run: |
          echo "results=gate-controls=${{ needs.gate-controls.result }},engine-web-conformance=${{ needs.engine-web-conformance.result }},sync-real-server=${{ needs.sync-real-server.result }},gateway-real=${{ needs.gateway-real.result }},dart=${{ needs.dart.result }},android=${{ needs.android.result }},windows=${{ needs.windows.result }},owner-native-it=${{ needs.owner-native-it.result }},owner-android=${{ needs.owner-android.result }},owner-windows=${{ needs.owner-windows.result }}" >> "$GITHUB_OUTPUT"
          echo "gate-controls=${{ needs.gate-controls.result }} engine-web=${{ needs.engine-web-conformance.result }} sync-real-server=${{ needs.sync-real-server.result }} gateway-real=${{ needs.gateway-real.result }} dart=${{ needs.dart.result }} android=${{ needs.android.result }} windows=${{ needs.windows.result }}"
          test "${{ needs.gate-controls.result }}" = success
          test "${{ needs.engine-web-conformance.result }}" = success
          test "${{ needs.sync-real-server.result }}" = success
          test "${{ needs.gateway-real.result }}" = success
          test "${{ needs.dart.result }}" = success
          test "${{ needs.android.result }}" = success
          test "${{ needs.windows.result }}" = success
          test "${{ needs.owner-native-it.result }}" = success
          test "${{ needs.owner-android.result }}" = success
          test "${{ needs.owner-windows.result }}" = success
          echo NATIVE-CLIENT-CI-OK
