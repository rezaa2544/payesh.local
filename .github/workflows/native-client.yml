name: native-client

# ═══════════════════════════════════════════════════════════════════
#  Native Payesh client — ADR-43 / D-43 · rows 63 + 69 + 70 + 71 + 72 + 73 + 75
#  One Flutter/Dart codebase → standalone Android APK/AAB + Windows EXE.
#  No WebView, no browser wrapper, no Node.js in the client bundle.
#
#  Rules (fail-closed):
#   · Flutter is pinned (version + archive sha256 + framework revision); a mismatch is red.
#   · pub get --enforce-lockfile, dart format, analyze with --fatal-infos (0 warnings/infos),
#     tests + line-coverage gate on every package.
#   · pubspec.lock must not contain any WebView / JS-engine package.
#   · Independent native gate (tools/native-independence-gate.mjs, criterion
#     docs/cloud/43-native-independence.json) runs on the REAL release output of this run:
#     app-release.apk, app-release.aab and the Windows Release folder. A "native" claim is
#     accepted only when this gate passes on these artifacts.
#   · Negative controls: the same gate must REJECT the shipped WebView/Node bundles
#     (continuous payesh-local.apk / payesh-local-windows.zip, owner-continuous payesh-owner.apk)
#     and the committed releases/payesh-local-windows-0.9.2.zip. If a control passes, the gate is broken → red.
#   · Release APK/AAB here are CI evidence builds (debug-signed by the Flutter template), never
#     published; school signing and build.yml are untouched.
# ═══════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main, 'arena/**', 'hermes/**']
    paths:
      - 'apps/payesh/**'
      - 'tools/native-independence-gate.mjs'
      - 'tests/native-gate-63.js'
      - 'tests/conformance-engine-70.js'
      - 'tests/conformance-outbox-71.js'
      - 'tests/conformance-jalali-73.js'
      - 'client/app.js'
      - 'client/import.js'
      - 'client/engine-web.js'
      - 'client/outbox-web.js'
      - 'server/sync.js'
      - 'server/gateway.js'
      - 'server/tenancy.js'
      - 'docs/cloud/43-native-independence.json'
      - 'docs/cloud/contracts/conformance/**'
      - '.github/workflows/native-client.yml'
  pull_request:
    paths:
      - 'apps/payesh/**'
      - 'tools/native-independence-gate.mjs'
      - 'tests/native-gate-63.js'
      - 'tests/conformance-engine-70.js'
      - 'tests/conformance-outbox-71.js'
      - 'tests/conformance-jalali-73.js'
      - 'client/app.js'
      - 'client/import.js'
      - 'client/engine-web.js'
      - 'client/outbox-web.js'
      - 'server/sync.js'
      - 'server/gateway.js'
      - 'server/tenancy.js'
      - 'docs/cloud/43-native-independence.json'
      - 'docs/cloud/contracts/conformance/**'
      - '.github/workflows/native-client.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payesh-native-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  FLUTTER_REVISION: 'c197ca5199e9ee5661e865596c9c07294dfab51c'
  FLUTTER_LINUX_SHA256: '25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a'
  FLUTTER_WINDOWS_SHA256: 'd8e2b5977e09082c6440f89dc1aa887b94c8fbcc3b39222797046295a3f68a9e'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  COVERAGE_MIN: '80'

jobs:
  gate-controls:
    name: Native gate — self-test + negative controls (row 63)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate unit tests (synthetic clean/dirty APK, AAB, Windows bundles)
        run: node tests/native-gate-63.js
      - name: Download shipped WebView/Node bundles (negative controls)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p neg
          gh release download continuous --repo "$GITHUB_REPOSITORY" --dir neg --pattern payesh-local.apk --pattern payesh-local-windows.zip
          gh release download owner-continuous --repo "$GITHUB_REPOSITORY" --dir neg --pattern payesh-owner.apk
          ls -la neg
          sha256sum neg/* releases/payesh-local-windows-0.9.2.zip
      - name: Gate must REJECT every control (expect-fail)
        run: |
          set -euo pipefail
          node tools/native-independence-gate.mjs --expect-fail \
            --android neg/payesh-local.apk neg/payesh-owner.apk \
            --windows neg/payesh-local-windows.zip releases/payesh-local-windows-0.9.2.zip | tee native-gate-negative.txt
          grep -q 'NATIVE-GATE-NEGATIVE-CONTROL-OK' native-gate-negative.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-gate-negative-controls
          path: native-gate-negative.txt

  engine-web-conformance:
    name: Web parity — shared engine + outbox + Jalali vectors on the web client (rows 70/71/73)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Same vectors run against the Dart SQLite engine in the `dart` job
      # (apps/payesh/packages/payesh_data/test/conformance_test.dart).
      - name: engine-v1 vectors on client/engine-web.js (IndexedDB)
        run: node tests/conformance-engine-70.js
      # Same outbox vectors run against the Dart outbox (payesh_sync/test/outbox_conformance_test.dart).
      - name: outbox-v1 vectors on client/outbox-web.js (IndexedDB)
        run: node tests/conformance-outbox-71.js
      # Same Jalali vectors run against the Dart port (payesh_ui/test/jalali_conformance_test.dart).
      - name: jalali-v1 vectors regenerated from client/app.js + client/import.js must equal the committed file
        run: node tests/conformance-jalali-73.js

  sync-real-server:
    name: Dart sync client against the REAL Node server (row 71)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Flutter ${{ env.FLUTTER_VERSION }} (pinned, sha256-verified)
        run: |
          set -euo pipefail
          F="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$F" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$F"
          echo "${FLUTTER_LINUX_SHA256}  $RUNNER_TEMP/$F" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$F" -C "$RUNNER_TEMP"
          git config --global --add safe.directory "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: pub get (lockfile enforced)
        working-directory: apps/payesh
        run: flutter pub get --enforce-lockfile
      # server_it_test.dart spawns `node server/index.js` (fresh data dir), then:
      # offline push applied once, duplicate uid, pull into SQLite, bad token → queued,
      # server killed → op kept → restart → applied exactly once, per-op rejection.
      - name: payesh_sync ⇄ server/index.js
        working-directory: apps/payesh/packages/payesh_sync
        env:
          PAYESH_SERVER_IT: '1'
        run: |
          set -euo pipefail
          dart test --reporter expanded test/server_it_test.dart | tee "$GITHUB_WORKSPACE/sync-real-server.txt"
          # exactly 8 executed, none skipped (a skipped run prints "~N")
          grep -qE '\+8: All tests passed' "$GITHUB_WORKSPACE/sync-real-server.txt"
          if grep -qE '~[0-9]+' "$GITHUB_WORKSPACE/sync-real-server.txt"; then echo 'SYNC-IT-SKIPPED'; exit 1; fi
          echo SYNC-REAL-SERVER-OK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-real-server
          path: sync-real-server.txt

  gateway-real:
    name: Dart Gateway client — pinned TLS against the REAL Gateway + PostgreSQL (row 75)
    runs-on: ubuntu-latest
    services:
      # Throwaway CI database. trust auth: tenancy.migrate creates the password-less
      # payesh_runtime LOGIN role exactly as in production-like tests (tests/gateway-pg.js).
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: payesh_gw75
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Flutter ${{ env.FLUTTER_VERSION }} (pinned, sha256-verified)
        run: |
          set -euo pipefail
          F="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$F" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$F"
          echo "${FLUTTER_LINUX_SHA256}  $RUNNER_TEMP/$F" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$F" -C "$RUNNER_TEMP"
          git config --global --add safe.directory "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: pub get (lockfile enforced)
        working-directory: apps/payesh
        run: flutter pub get --enforce-lockfile
      # gateway_it_test.dart: real server/gateway.js (runtime role, RLS) behind a TLS front with
      # a throwaway openssl CA. push applied once + duplicate, request-id/version/device headers
      # observed on the wire, paged pull into SQLite, tenant B isolation, real conflict verdict,
      # MITM (trusted CA, unpinned key) → refused with ZERO bytes sent, bad token → 401.
      - name: payesh_sync ⇄ server/gateway.js (pinned TLS)
        working-directory: apps/payesh/packages/payesh_sync
        env:
          PAYESH_GW_IT: '1'
          PAYESH_PG_ADMIN: postgres://postgres@127.0.0.1:5432/payesh_gw75
          PAYESH_PG_RUNTIME: postgres://payesh_runtime@127.0.0.1:5432/payesh_gw75
        run: |
          set -euo pipefail
          command -v openssl
          dart test --reporter expanded test/gateway_it_test.dart test/pinning_test.dart test/data_path_test.dart | tee "$GITHUB_WORKSPACE/gateway-real.txt"
          if grep -qE '~[0-9]+' "$GITHUB_WORKSPACE/gateway-real.txt"; then echo 'GATEWAY-IT-SKIPPED'; exit 1; fi
          grep -qE '\+[0-9]+: All tests passed' "$GITHUB_WORKSPACE/gateway-real.txt"
          echo GATEWAY-REAL-OK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-real
          path: gateway-real.txt

  dart:
    name: Flutter — pub get, format, analyze, test, coverage (row 69)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/payesh
    steps:
      - uses: actions/checkout@v4
      - name: Flutter ${{ env.FLUTTER_VERSION }} (pinned, sha256-verified)
        working-directory: .
        run: |
          set -euo pipefail
          F="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$F" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$F"
          echo "${FLUTTER_LINUX_SHA256}  $RUNNER_TEMP/$F" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$F" -C "$RUNNER_TEMP"
          git config --global --add safe.directory "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Verify framework revision
        run: |
          set -euo pipefail
          flutter config --no-analytics >/dev/null
          flutter --version --machine | tee "$RUNNER_TEMP/fv.json"
          grep -q "\"frameworkRevision\": \"${FLUTTER_REVISION}\"" "$RUNNER_TEMP/fv.json"
      - name: pub get (lockfile enforced)
        run: flutter pub get --enforce-lockfile
      - name: No WebView / JS-engine package in the dependency graph
        run: |
          set -euo pipefail
          if grep -nEi '^  (webview[a-z_]*|[a-z_]*_webview[a-z_]*|flutter_inappwebview[a-z_]*|flutter_js|flutter_qjs|nodejs[a-z_]*|capacitor[a-z_]*|cordova[a-z_]*):' pubspec.lock; then
            echo 'NATIVE-DEPS-FAIL a WebView/JS package is in pubspec.lock'; exit 1
          fi
          echo 'NATIVE-DEPS-OK'
      - name: dart format (no diff)
        run: dart format --output=none --set-exit-if-changed app/lib app/test packages tool
      - name: analyze (0 errors, 0 warnings, 0 infos)
        run: |
          set -euo pipefail
          (cd app && flutter analyze --fatal-infos --fatal-warnings)
          for p in packages/*/; do
            if grep -q 'sdk: flutter' "$p/pubspec.yaml"; then (cd "$p" && flutter analyze --fatal-infos --fatal-warnings)
            else (cd "$p" && dart analyze --fatal-infos --fatal-warnings); fi
          done
          dart analyze --fatal-infos tool
      - name: tests + coverage
        run: |
          set -euo pipefail
          (cd app && flutter test --coverage)
          # Flutter packages (payesh_ui: widgets + goldens with the bundled font) → flutter test
          for p in packages/*/; do
            if grep -q 'sdk: flutter' "$p/pubspec.yaml"; then (cd "$p" && flutter test --concurrency=1 --coverage)
            else (cd "$p" && dart run coverage:test_with_coverage); fi
          done
          dart tool/coverage_check.dart "$COVERAGE_MIN" app/coverage/lcov.info packages/*/coverage/lcov.info | tee coverage-summary.txt
      # Row 73: goldens rendered with the REAL Vazirmatn (light/dark × Android/Windows × text 2x),
      # RTL / Jalali / a11y widget tests and the web-generated Jalali vectors — must all execute.
      - name: payesh_ui goldens + RTL/Jalali/a11y (row 73, none skipped)
        working-directory: apps/payesh/packages/payesh_ui
        run: |
          set -euo pipefail
          flutter test --concurrency=1 --reporter expanded | tee "$GITHUB_WORKSPACE/ui-73.txt"
          if grep -qE '~[0-9]+' "$GITHUB_WORKSPACE/ui-73.txt"; then echo 'UI-TESTS-SKIPPED'; exit 1; fi
          test "$(grep -cE 'golden (android|windows)_' "$GITHUB_WORKSPACE/ui-73.txt")" -ge 5
          ls test/goldens/*.png | tee -a "$GITHUB_WORKSPACE/ui-73.txt"
          sha256sum test/goldens/*.png fonts/*.ttf | tee -a "$GITHUB_WORKSPACE/ui-73.txt"
          echo UI-73-OK | tee -a "$GITHUB_WORKSPACE/ui-73.txt"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: apps/payesh/packages/payesh_ui/test/failures/
      - uses: actions/upload-artifact@v4
        with:
          name: native-coverage
          path: |
            apps/payesh/coverage-summary.txt
            apps/payesh/app/coverage/lcov.info
            apps/payesh/packages/*/coverage/lcov.info
            ui-73.txt

  android:
    name: Android release build + native gate on APK/AAB
    needs: dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Flutter ${{ env.FLUTTER_VERSION }} (pinned, sha256-verified)
        run: |
          set -euo pipefail
          F="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$F" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$F"
          echo "${FLUTTER_LINUX_SHA256}  $RUNNER_TEMP/$F" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$F" -C "$RUNNER_TEMP"
          git config --global --add safe.directory "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build APK + AAB (release)
        working-directory: apps/payesh/app
        run: |
          set -euo pipefail
          flutter config --no-analytics >/dev/null
          flutter pub get --enforce-lockfile
          flutter build apk --release
          flutter build appbundle --release
      - name: Native gate on the REAL APK/AAB
        run: |
          set -euo pipefail
          OUT=apps/payesh/app/build/app/outputs
          mkdir -p native-out
          cp "$OUT/flutter-apk/app-release.apk" native-out/payesh-native.apk
          cp "$OUT/bundle/release/app-release.aab" native-out/payesh-native.aab
          node tools/native-independence-gate.mjs --android native-out/payesh-native.apk native-out/payesh-native.aab | tee native-out/native-gate-android.txt
          grep -q '^NATIVE-GATE-OK' native-out/native-gate-android.txt
          (cd native-out && sha256sum payesh-native.apk payesh-native.aab | tee SHA256SUMS-android)
      # Row 72: the APK must carry the encrypting SQLite build (SQLite3 Multiple Ciphers) for
      # every ABI — never plain SQLite (the app refuses to open its database without it).
      - name: Encrypted SQLite is bundled in the APK (row 72)
        run: |
          set -euo pipefail
          mkdir -p /tmp/apkx && unzip -q -o native-out/payesh-native.apk 'lib/*' -d /tmp/apkx
          found=0
          for so in $(find /tmp/apkx/lib -name '*sqlite3*.so'); do
            v=$(grep -a -o -m1 'SQLite3 Multiple Ciphers [0-9.]*' "$so" | head -1 || true)
            echo "$(echo "$so" | sed 's#/tmp/apkx/##') sha256=$(sha256sum "$so" | cut -c1-64) ${v:-NO-CIPHER}"
            test -n "$v"
            found=$((found+1))
          done | tee native-out/sqlite-cipher-android.txt
          test "$(grep -c 'Multiple Ciphers' native-out/sqlite-cipher-android.txt)" -ge 1
          echo SQLITE-CIPHER-ANDROID-OK | tee -a native-out/sqlite-cipher-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-android
          path: native-out/

  windows:
    name: Windows release build + native gate on EXE bundle
    needs: dart
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Flutter ${{ env.FLUTTER_VERSION }} (pinned, sha256-verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $F = "flutter_windows_$($env:FLUTTER_VERSION)-stable.zip"
          $Z = Join-Path $env:RUNNER_TEMP $F
          Invoke-WebRequest -Uri "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/$F" -OutFile $Z
          $h = (Get-FileHash $Z -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:FLUTTER_WINDOWS_SHA256) { throw "flutter archive sha256 mismatch: $h" }
          tar -xf $Z -C $env:RUNNER_TEMP
          git config --global --add safe.directory '*'
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP 'flutter\bin')
      - name: Build Windows (release)
        shell: pwsh
        working-directory: apps/payesh/app
        run: |
          $ErrorActionPreference = 'Stop'
          flutter config --no-analytics | Out-Null
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'pub get failed' }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'flutter build windows failed' }
      # Row 72: real DPAPI (crypt32.dll) + encrypted SQLite on Windows — not a fake.
      - name: payesh_secure (REAL DPAPI) + payesh_data (SQLite3MC) tests on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location apps/payesh/packages/payesh_secure
          dart test --reporter expanded test/dpapi_windows_test.dart | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/dpapi-windows.txt"
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI tests failed' }
          Pop-Location
          $t = Get-Content "$env:GITHUB_WORKSPACE/dpapi-windows.txt" -Raw
          if ($t -notmatch '\+5: All tests passed') { throw 'expected exactly 5 DPAPI tests to pass' }
          if ($t -match '~[0-9]+') { throw 'DPAPI tests were skipped' }
          Push-Location apps/payesh/packages/payesh_data
          dart test --reporter expanded test/encrypted_database_test.dart | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/sqlcipher-windows.txt"
          if ($LASTEXITCODE -ne 0) { throw 'encrypted database tests failed on Windows' }
          Pop-Location
          'DPAPI-WINDOWS-OK' | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/dpapi-windows.txt" -Append
      - name: Encrypted SQLite is bundled in the Windows build (row 72)
        shell: bash
        run: |
          set -euo pipefail
          REL=apps/payesh/app/build/windows/x64/runner/Release
          mkdir -p native-out
          for d in $(find "$REL" -iname '*sqlite3*.dll'); do
            v=$(grep -a -o -m1 'SQLite3 Multiple Ciphers [0-9.]*' "$d" | head -1 || true)
            echo "$(basename "$d") sha256=$(sha256sum "$d" | cut -c1-64) ${v:-NO-CIPHER}"
            test -n "$v"
          done | tee native-out/sqlite-cipher-windows.txt
          grep -q 'Multiple Ciphers' native-out/sqlite-cipher-windows.txt
          cp dpapi-windows.txt sqlcipher-windows.txt native-out/
          echo SQLITE-CIPHER-WINDOWS-OK | tee -a native-out/sqlite-cipher-windows.txt
      - name: Native gate on the REAL Windows bundle
        shell: bash
        run: |
          set -euo pipefail
          REL=apps/payesh/app/build/windows/x64/runner/Release
          ls -la "$REL"
          mkdir -p native-out
          node tools/native-independence-gate.mjs --windows "$REL" | tee native-out/native-gate-windows.txt
          grep -q '^NATIVE-GATE-OK' native-out/native-gate-windows.txt
          (cd "$REL" && 7z a -tzip -r "$GITHUB_WORKSPACE/native-out/payesh-native-windows.zip" . >/dev/null)
          node tools/native-independence-gate.mjs --windows native-out/payesh-native-windows.zip | tee -a native-out/native-gate-windows.txt
          (cd native-out && sha256sum payesh-native-windows.zip | tee SHA256SUMS-windows)
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: native-out/

  native-gate:
    name: native-gate (all must pass)
    needs: [gate-controls, engine-web-conformance, sync-real-server, gateway-real, dart, android, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: |
          echo "gate-controls=${{ needs.gate-controls.result }} engine-web=${{ needs.engine-web-conformance.result }} sync-real-server=${{ needs.sync-real-server.result }} gateway-real=${{ needs.gateway-real.result }} dart=${{ needs.dart.result }} android=${{ needs.android.result }} windows=${{ needs.windows.result }}"
          test "${{ needs.gate-controls.result }}" = success
          test "${{ needs.engine-web-conformance.result }}" = success
          test "${{ needs.sync-real-server.result }}" = success
          test "${{ needs.gateway-real.result }}" = success
          test "${{ needs.dart.result }}" = success
          test "${{ needs.android.result }}" = success
          test "${{ needs.windows.result }}" = success
          echo NATIVE-CLIENT-CI-OK
