name: downloads-page

# Row 169 — the «⬇️ دانلودها» release: ONE categorized list of every download (Windows 64-bit, Windows 32-bit,
# Android, cloud server, checksums) on top of the Releases page and marked «Latest». Its body is generated by
# tools/release/downloads.mjs (the same source as the README block) and links straight to the files the
# publishers upload (row 161). The release itself carries no files.
# Kept on top: when any other release is newer, `downloads` is deleted and created again (it has no assets,
# so nothing is lost). The technical releases (update blobs) get an explicit «do not download» title.

on:
  workflow_run:
    workflows: [school-native-publish, owner-native-publish, build-and-release, win32-publish]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'tools/release/downloads.mjs'
      - '.github/workflows/downloads-page.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads-page
  cancel-in-progress: false

jobs:
  page:
    name: «دانلودها» release — categorized direct links (row 169)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: README block is current
        run: node tools/release/downloads.mjs --check
      - name: Versions of the published builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          run_of() { gh release download "$1" -R "$R" -p "$2" -O - 2>/dev/null | jq -r '.run_number // empty' || true; }
          SB=$(run_of native-continuous school-native-status.json)
          OB=$(run_of owner-continuous owner-native-status.json)
          DS=$(node -p "require('./package.json').version")
          jq -n --arg sb "$SB" --arg ob "$OB" --arg ds "$DS" --arg c "$GITHUB_SHA" --arg u "$(date -u +%Y-%m-%dT%H:%MZ)" \
            '{school_build: ($sb|tonumber? // null), owner_build: ($ob|tonumber? // null), data_service: $ds, commit: $c, updated: $u}' > info.json
          cat info.json
      - name: Publish the «دانلودها» release (Latest, on top)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"; T=downloads
          TITLE=$(node -e 'import("./tools/release/downloads.mjs").then(m => console.log(m.RELEASE_TITLE))')
          node tools/release/downloads.mjs --release-body --info info.json > body.md
          newest=$(gh api "repos/$R/releases?per_page=1" --jq '.[0].tag_name // ""')
          create() { gh release create "$T" -R "$R" --target main --latest --title "$TITLE" --notes-file body.md; }
          if gh release view "$T" -R "$R" >/dev/null 2>&1; then
            if [ "$newest" != "$T" ]; then
              echo "another release ($newest) is newer — recreating $T on top"
              gh release delete "$T" -R "$R" -y --cleanup-tag
              create
            else
              gh release edit "$T" -R "$R" --prerelease=false --latest --title "$TITLE" --notes-file body.md
            fi
          else
            create
          fi
          # technical channels: explicit «do not download» titles (their publishers create them once)
          for pair in "app-files|⚙️ فنی — تکه‌های به‌روزرسانی خودکار اپ مدرسه (دستی دانلود نکنید)" \
                      "owner-files|⚙️ فنی — تکه‌های به‌روزرسانی خودکار پنل مالک (دستی دانلود نکنید)" \
                      "app32-files|⚙️ فنی — تکه‌های به‌روزرسانی خودکار اپ مدرسهٔ ۳۲ بیتی (دستی دانلود نکنید)" \
                      "owner32-files|⚙️ فنی — تکه‌های به‌روزرسانی خودکار پنل مالک ۳۲ بیتی (دستی دانلود نکنید)"; do
            tag="${pair%%|*}"; title="${pair#*|}"
            if gh release view "$tag" -R "$R" >/dev/null 2>&1; then gh release edit "$tag" -R "$R" --prerelease --title "$title"; fi
          done
          latest=$(gh api "repos/$R/releases/latest" --jq .tag_name)
          [ "$latest" = "$T" ] || { echo "::error::Latest release is $latest, not $T"; exit 1; }
          gh release view "$T" -R "$R" --json name,isPrerelease,isLatest 2>/dev/null || gh release view "$T" -R "$R" --json name,isPrerelease
          echo "DOWNLOADS-PAGE-OK"
