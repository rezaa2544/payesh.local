name: security-scan
# CI hardening task (Notion: [aknon] CI hardening - zizmor + SHA pin + Gitleaks).
# Static security gates for the workflow files themselves and for leaked secrets.
# This workflow never publishes anything; it only fails the PR/push when a gate trips.

on:
  pull_request:
    paths:
      - '.github/**'
      - '.gitleaks.toml'
      - '.gitleaksignore'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - '.gitleaks.toml'
      - '.gitleaksignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor (workflow security audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor (pinned)
        run: python3 -m pip install --user "zizmor==1.33.1"
      - name: Audit all workflows
        # Remaining accepted findings (documented in docs/security/CI-HARDENING.md):
        # artipacked in build.yml and superfluous-actions (softprops) are warning/info
        # level, so the gate fails on high-severity findings (the old error class).
        run: |
          "$HOME/.local/bin/zizmor" --format plain --no-online-audits \
            --min-severity high .github/workflows

  gitleaks:
    name: gitleaks (secret scan, binary)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks binary (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan working tree against the reviewed baseline
        # .gitleaksignore (repo root) is the reviewed baseline of historical
        # test-vector/fixture findings; anything new fails this job.
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose
      - name: Scan git history
        run: gitleaks git . --config .gitleaks.toml --redact
