name: build-and-release

on:
  push:
    tags: ['v*']
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # کار ساخت بسته و کار نصب‌کننده هر دو روی ریلیز «continuous» می‌نویسند؛
    # اگر هم‌زمان اجرا شوند، یکی فایل دیگری را نصفه می‌گذارد.
    concurrency:
      # هر شاخه گروه خودش را دارد؛ وگرنه اجرای شاخهٔ کاری، اجرای main را
      # از صف بیرون می‌اندازد و نسخهٔ تازه هرگز منتشر نمی‌شود.
      # درون یک شاخه هم اجراها یکی‌یکی می‌روند تا فایل‌های انتشار نصفه نشوند.
      group: payesh-release-${{ github.ref }}
      cancel-in-progress: false
    name: آزمون، بستهٔ ویندوز و APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: نصب وابستگی‌های آزمون
        run: npm install --no-audit --no-fund

      - name: آزمون‌های سرور
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # نتیجهٔ آزمون را به‌صورت «annotation» بیرون بده تا بدون لاگ هم دیده شود
            grep -E "✗" -A3 /tmp/test.log | head -60 | while IFS= read -r line; do
              echo "::error title=آزمون ناموفق::$line"
            done
            # خط‌های ✗ لاگ را به‌صورت annotation بیرون بده (لاگ کامل همیشه در دسترس نیست)
            grep -E "✗" /tmp/test.log | head -10 | sed 's/^/::error::/' || true
          else
            tail -3 /tmp/test.log
          fi
          exit $code

      - name: آزمون رابط، جریان کاربری، صندوقچه و به‌روزرسانی
        run: |
          npm run test:ui
          npm run test:flow
          npm run test:update
          npm run test:tunnel

      # ورود همهٔ نقش‌ها (مدیر، دبیر، دانش‌آموز، ولی، معاون، عامل اجرایی) روی
      # نسخهٔ گوشی بدون سیستم مدرسه — هیچ‌کس نباید به دیوار «نیاز به سیستم
      # مدرسه» بخورد، و هیچ دکمه‌ای نباید خطای اجرایی بدهد.
      - name: آزمون گوشی — ورود همهٔ نقش‌ها
        run: npm run test:phone

      - name: ساخت بسته و مانیفست دلتا
        run: node scripts/build-release.mjs

      # مانیفست باید روی شاخهٔ main باشد تا برنامه‌ها بتوانند «نسخهٔ تازه» را
      # از همین‌جا ببینند و فقط فایل‌های تغییرکرده را بگیرند.
      - name: ثبت مانیفست در مخزن (کانال به‌روزرسانی درجا)
        if: github.ref == 'refs/heads/main'
        run: |
          # کامیت خودکارِ همین مرحله نباید دوباره اجرا شود
          if git log -1 --pretty=%B | grep -q "\[skip ci\]"; then
            echo "کامیت مانیفست؛ رد می‌شود"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/manifest.json releases/history
          if git diff --cached --quiet; then
            echo "مانیفست تغییری نکرد"
            exit 0
          fi
          V=$(node -p "require('./releases/manifest.json').version")
          git commit -m "chore(release): مانیفست $V [skip ci]"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: بررسی Android SDK پیش‌نصب‌شده
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | tail -3 || true

      - uses: gradle/actions/setup-gradle@v3
        # فقط برای حافظهٔ موقت است؛ اگر سرویسش بالا نیاید، ساخت APK باید ادامه دهد
        continue-on-error: true
        with:
          gradle-version: '8.7'

      - name: ساخت APK اندروید
        env:
          # آدرس سامانه که داخل APK پخته می‌شود (تنظیم با gh variable set PAYESH_PUBLIC_URL)
          PAYESH_APP_URL: ${{ vars.PAYESH_PUBLIC_URL }}
          # نام صندوقچهٔ ابری که داخل APK پخته می‌شود (اختیاری — gh variable set CLOUD_BUCKET)
          PAYESH_CLOUD_BUCKET: ${{ vars.CLOUD_BUCKET }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "ساخت APK نسخهٔ $VERSION"
          node scripts/bake-cloud.mjs
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" install/android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" install/android/app/build.gradle
          grep -E "versionName|versionCode" install/android/app/build.gradle
          # نسخهٔ «انتشار» ساخته می‌شود، نه debug:
          #  • debuggable=false → گوگل برنامه را «آزمایشی» نمی‌بیند
          #  • امضای v1+v2+v3 با کلید ثابت → نصب و به‌روزرسانی بی‌هشدار
          set +e
          gradle assembleRelease --no-daemon -p install/android > /tmp/gradle.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # خطا را به‌صورت annotation بیرون بده تا بدون لاگ هم دیده شود
            grep -E "What went wrong|FAILURE:|error:|Caused by:|Could not|Execution failed|lint" -A4 /tmp/gradle.log \
              | head -60 | while IFS= read -r line; do echo "::error title=Gradle::$line"; done
            tail -40 /tmp/gradle.log | while IFS= read -r line; do echo "::error title=Gradle tail::$line"; done
            exit $code
          fi
          tail -4 /tmp/gradle.log
          echo "آدرس پخته‌شده در APK: ${PAYESH_APP_URL:-خالی (برنامه از android-config.json یا شبکه پیدا می‌کند)}"

      - name: بررسی امضا و استانداردهای APK (گوگل)
        run: |
          set +e
          APK=install/android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "SDK=$SDK build-tools=$BT"
          # ── ۱) تراز بایت (zipalign): شرط نصب روان و بی‌خطا در اندروید ──
          if [ -n "$BT" ] && [ -x "$BT/zipalign" ]; then
            "$BT/zipalign" -c -v 4 "$APK" > /tmp/align.txt 2>&1
            if [ $? -ne 0 ]; then
              echo "::error::APK تراز (zipalign) نیست — اندروید نصب آن را رد می‌کند"
              tail -5 /tmp/align.txt
              exit 1
            fi
            echo "✓ تراز بایت درست است (zipalign)"
          fi
          # ── ۲) امضای v1/v2/v3 با کلید ثابت ─────────────────────────────
          SIGNED=no
          if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then
            "$BT/apksigner" verify --verbose --print-certs "$APK" > /tmp/sig.txt 2>&1
            echo "apksigner exit=$?"
            head -14 /tmp/sig.txt
            for scheme in "v2 scheme: true" "v3 scheme: true"; do
              if ! grep -q "Verified using $scheme" /tmp/sig.txt; then
                echo "::error::امضای «$scheme» نیست — اندروید ۷ به بعد برنامه را قبول نمی‌کند"
                exit 1
              fi
            done
            echo "✓ امضای v2 و v3 هر دو درست است"
            if grep -q "Signer #1 certificate SHA-256 digest" /tmp/sig.txt; then
              SIGNED=yes
              FP=$(grep "Signer #1 certificate SHA-256 digest" /tmp/sig.txt | tr -d ' ' | cut -d: -f2 | tr 'A-F' 'a-f')
              echo "اثر انگشت امضا: $FP"
              # کلید باید همان کلید ثابت مخزن باشد؛ وگرنه نصب روی نسخهٔ قبلی رد می‌شود
              if [ "$FP" != "d646302bdfae9495c8726c3d582f5816dca5401e2cfb77b137c845cff6b2e36e" ]; then
                echo "::error::کلید امضا با کلید ثابت مخزن یکی نیست ($FP) — به‌روزرسانی روی گوشی‌ها نصب نخواهد شد"
                exit 1
              fi
            fi
          fi
          if [ "$SIGNED" = no ]; then
            # بررسی ساده و بدون ابزار: آیا بلوک امضا داخل فایل هست؟
            if unzip -l "$APK" | grep -Eq "META-INF/[^/]+\.(RSA|DSA|EC)$"; then SIGNED=yes; fi
            if grep -qa "APK Sig Block 42" "$APK"; then SIGNED=yes; fi
            echo "بررسی بدون ابزار: امضا=$SIGNED"
          fi
          if [ "$SIGNED" != yes ]; then
            echo "::error::APK امضا نشده — روی گوشی نصب نمی‌شود"
            exit 1
          fi
          echo "APK امضا شده است."

      - name: بررسی سلامت APK
        run: |
          APK=install/android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK" || { echo "APK ساخته نشد"; exit 1; }
          # نسخهٔ منتشرشده نباید «اشکال‌زدایی‌شدنی» باشد؛ وگرنه گوگل آن را
          # برنامهٔ آزمایشی می‌شناسد و هنگام نصب هشدار می‌دهد.
          SDK2="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT2=$(ls -d "$SDK2"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BT2" ] && [ -x "$BT2/aapt" ]; then
            if "$BT2/aapt" dump badging "$APK" 2>/dev/null | grep -q "application-debuggable"; then
              echo "::error::APK نسخهٔ debug است — باید نسخهٔ release ساخته شود"
              exit 1
            fi
            echo "✓ نسخهٔ انتشار است (debuggable=false)"
            "$BT2/aapt" dump badging "$APK" 2>/dev/null | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|uses-permission)" | head -12
          fi
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          # برنامهٔ کاملِ وب باید داخل APK باشد (نه یک پوستهٔ خالی)
          for f in assets/www/index.html assets/www/app.js assets/www/pages.js assets/www/styles.css assets/www/sw.js assets/www/lib/s3mini.js assets/www/lib/sigv4.js assets/www/lib/phone.js assets/www/lib/hash.js assets/www/cloud-baked.js; do
            unzip -l "$APK" | grep -q "$f" || { echo "کم است: $f — APK فقط پوسته است"; exit 1; }
          done
          COUNT=$(unzip -l "$APK" | grep -c "assets/www/")
          echo "فایل‌های برنامه داخل APK: $COUNT"
          [ "$COUNT" -ge 10 ] || { echo "تعداد فایل‌های برنامه کم است"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          echo "APK سالم است: $SIZE بایت"
          [ "$SIZE" -ge 150000 ] || { echo "حجم APK برای نسخهٔ کامل خیلی کم است ($SIZE)"; exit 1; }

      - name: ساخت بستهٔ استقرار ابری (payesh-cloud.zip)
        run: node scripts/build-cloud-bundle.mjs

      - name: آماده‌سازی فایل‌های انتشار
        run: |
          mkdir -p out
          cp install/android/app/build/outputs/apk/release/app-release.apk out/payesh-local.apk
          # نام ثابت برای لینک‌های همیشه‌درست در README
          cp releases/payesh-local-windows-*.zip out/payesh-local-windows.zip
          cp releases/*.zip releases/*.tar.gz out/ 2>/dev/null || true
          cp releases/manifest.json out/manifest.json
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: payesh-local
          path: out/*

      - name: انتشار پیوسته (هر push روی main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view continuous >/dev/null 2>&1; then
            echo "release exists"
          else
            gh release create continuous --prerelease \
              --title "آخرین نسخهٔ ساخته‌شده" \
              --notes "این نسخه با هر push روی main به‌روز می‌شود. لینک‌های ثابت: payesh-local-windows.zip و payesh-local.apk"
          fi
          for i in 1 2 3; do
            gh release upload continuous out/payesh-local.apk out/payesh-local-windows.zip out/payesh-cloud.zip out/manifest.json --clobber && break
            echo "تلاش $i ناموفق بود؛ ۱۵ ثانیه بعد دوباره"; sleep 15
          done

      - name: انتشار (روی تگ)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/payesh-local.apk
            out/payesh-local-windows.zip
            out/payesh-local-windows-*.zip
            out/manifest.json
          generate_release_notes: true
          body: |
            ## پایش-لوکال
            - بستهٔ ویندوز: `payesh-local-windows-*.zip` (از حالت فشرده خارج کنید و `install.bat` را اجرا کنید)
            - اندروید: `payesh-local.apk` (نصب از منابع ناشناس را اجازه دهید)
            - آیفون: از Safari باز کنید و «افزودن به صفحهٔ اصلی»
            - به‌روزرسانی برنامه‌ها یک‌کلیکی و فقط با فایل‌های تغییرکرده انجام می‌شود.

  windows-installer:
    concurrency:
      group: payesh-release-${{ github.ref }}
      cancel-in-progress: false
    name: نصب‌کنندهٔ استاندارد ویندوز (payesh-setup.exe)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Node قابل حمل تا نصب بدون اینترنت هم کامل انجام شود
      - name: آوردن Node قابل حمل
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime | Out-Null
          $url = 'https://nodejs.org/dist/v22.14.0/win-x64/node.exe'
          Invoke-WebRequest -Uri $url -OutFile runtime/node.exe -UseBasicParsing
          "node.exe: {0:N1} MB" -f ((Get-Item runtime/node.exe).Length / 1MB)

      - name: آماده‌سازی پوشهٔ نصب
        run: node scripts/stage-windows.mjs

      - name: ساخت برنامهٔ ویندوز (Payesh.exe — پنجرهٔ واقعی + شناسنامه)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File desktop\build.ps1 -Out .build\win\desktop
          $exe = '.build\win\desktop\Payesh.exe'
          if (-not (Test-Path $exe)) { throw 'Payesh.exe ساخته نشد' }
          Get-ChildItem .build\win\desktop | Select-Object Name, Length | Format-Table
          # ── استاندارد مایکروسافت: شناسنامهٔ فایل نباید خالی باشد ──────────
          $vi = (Get-Item $exe).VersionInfo
          "ProductName=$($vi.ProductName)  Company=$($vi.CompanyName)  FileVersion=$($vi.FileVersion)"
          if (-not $vi.ProductName) { throw 'شناسنامهٔ فایل اجرایی خالی است (ProductName)' }
          if (-not $vi.CompanyName) { throw 'شناسنامهٔ فایل اجرایی خالی است (CompanyName)' }
          if (-not $vi.FileVersion) { throw 'نسخهٔ فایل نوشته نشده است' }
          # ── مانیفست asInvoker باید داخل exe باشد (بدون درخواست مدیر) ─────
          $txt = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes((Resolve-Path $exe)))
          if ($txt -notmatch 'asInvoker') { throw 'مانیفست asInvoker داخل exe نیست — ویندوز پنجرهٔ دسترسی مدیر نشان می‌دهد' }
          if ($txt -notmatch 'supportedOS') { throw 'شناسهٔ ویندوز ۱۰/۱۱ در مانیفست نیست' }
          "✓ شناسنامه و مانیفست برنامهٔ ویندوز درست است"

      - name: نصب Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'ISCC پیدا نشد' }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: بازبینی اسکریپت نصب
        run: node scripts/lint-iss.mjs

      - name: ساخت payesh-setup.exe
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          & $env:ISCC "/DAppVersion=$v" "installer\payesh.iss" 2>&1 | Tee-Object -FilePath iscc.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content iscc.log | Select-Object -Last 30 | ForEach-Object { "::error::ISCC: $_" }
            throw "ISCC ناموفق ($LASTEXITCODE)"
          }
          $exe = 'releases/payesh-setup.exe'
          if (-not (Test-Path $exe)) { throw 'خروجی exe ساخته نشد' }
          "✓ {0:N1} MB — نسخهٔ {1}" -f ((Get-Item $exe).Length/1MB), $v

      - uses: actions/upload-artifact@v4
        with:
          name: payesh-setup
          path: releases/payesh-setup.exe

      - name: انتشار در انتشار پیوسته
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload continuous releases/payesh-setup.exe --clobber
          gh release view continuous --json assets --jq '.assets[] | select(.name=="payesh-setup.exe") | "\(.name) — \(.size) بایت"'
