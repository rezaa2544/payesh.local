name: build-and-release

on:
  push:
    tags: ['v*']
    branches: [main, 'arena/**', 'hermes/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # کار ساخت بسته و کار نصب‌کننده هر دو روی ریلیز «continuous» می‌نویسند؛
    # اگر هم‌زمان اجرا شوند، یکی فایل دیگری را نصفه می‌گذارد.
    concurrency:
      # هر شاخه گروه خودش را دارد؛ وگرنه اجرای شاخهٔ کاری، اجرای main را
      # از صف بیرون می‌اندازد و نسخهٔ تازه هرگز منتشر نمی‌شود.
      # درون یک شاخه هم اجراها یکی‌یکی می‌روند تا فایل‌های انتشار نصفه نشوند.
      group: payesh-release-${{ github.ref }}
      cancel-in-progress: false
    name: آزمون، بستهٔ ویندوز و APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: دروازهٔ fail-closed کلید امضای Android
        run: |
          node tools/check-android-signing-safety.cjs --self-test
          node tools/check-android-signing-safety.cjs

      - name: نصب وابستگی‌های آزمون
        run: npm install --no-audit --no-fund

      - name: آزمون‌های سرور
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # نتیجهٔ آزمون را به‌صورت «annotation» بیرون بده تا بدون لاگ هم دیده شود
            grep -E "✗" -A3 /tmp/test.log | head -60 | while IFS= read -r line; do
              echo "::error title=آزمون ناموفق::$line"
            done
            # خط‌های ✗ لاگ را به‌صورت annotation بیرون بده (لاگ کامل همیشه در دسترس نیست)
            grep -E "✗" /tmp/test.log | head -10 | sed 's/^/::error::/' || true
          else
            tail -3 /tmp/test.log
          fi
          exit $code

      # آزمون راه‌اندازی خودکار پس از restart/آپدیت و جلوگیری از ناظر دوم.
      - name: بازیابی سرور پس از آپدیت (Supervisor restart)
        run: npm run test:restart

      # دروازهٔ P0 ردیف ۵۷: نشت فیلدهای حساس/هویتی کاربران (نقش غیرمدیر) +
      # کنترل مثبت مدیر + (با رد شدن) آزمون منفی داخلی.
      - name: دروازهٔ نشت کاربران (ردیف ۵۷)
        run: |
          set +e
          npm run test:pull57 > /tmp/pull57.log 2>&1
          code=$?
          grep -E "PL checks|failures" /tmp/pull57.log | head -5 | sed 's/^/::error::/' || true
          if [ $code -ne 0 ]; then exit $code; fi
          node tests/pull-leak-57-negative.js > /tmp/pull57-negative.log 2>&1
          code=$?
          grep -E 'FAIL  PL-|PL checks|PULL-LEAK-57-FAILED|NEGATIVE-LEAK-CONTROL' /tmp/pull57-negative.log | tail -20 || true
          if [ $code -ne 0 ]; then exit $code; fi
          npm run test:pentest57 > /tmp/pentest57.log 2>&1
          code=$?
          tail -5 /tmp/pentest57.log
          exit $code

      # ماتریس دسترسی نقش × مجموعه و نشت فیلدهای کاربر (ردیف ۵۷)، با کنترل‌های منفی.
      - name: ماتریس نشت نقش × مجموعه × فیلد (ردیف ۵۷)
        run: node tests/leak-matrix-57.js

      # مرز مخزن (ADR-32 / ردیف ۳۲): هر ارجاع به مخزن بایگانی یا مخزن بیرون
      # باید صریح در ALLOW ثبت شده باشد؛ وگرنه آزمون fail-closed قرمز می‌شود.
      - name: مرز مخزن (Repo Boundary — ردیف ۳۲)
        run: npm run test:boundary

      # گزارش شاهد تازه یا ویرایش‌شده باید SHA پایه و زمان اجرای UTC داشته باشد.
      # پوشه شامل گزارش‌های تاریخیِ قدیمی با قالب‌های متنوع است؛ گیت روی تغییرات همین اجراست.
      - name: کنترل SHA پایهٔ شواهد
        run: |
          set -e
          node tests/evidence-base-check.js
          node tools/check-evidence-base-selftest.cjs
          BASE="${{ github.event.before }}"
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" "$GITHUB_SHA" -- docs/cloud/reports/evidence/ > /tmp/evidence-files.txt
          else
            git fetch origin main
            git diff --name-only origin/main...HEAD -- docs/cloud/reports/evidence/ > /tmp/evidence-files.txt
          fi
          node tools/check-evidence-base.cjs --strict --files-from /tmp/evidence-files.txt

      # دروازهٔ شاهد: اثبات می‌کند لاگ آزمون واقعاً از همین درخت آمده است
      # (شمارش بدنه، هش بدنه، رجیستری آزمون‌ها، اثر انگشت کل درخت منهای docs/)
      - name: دروازهٔ شاهد آزمون
        run: |
          set +e
          OUT=$(bash docs/cloud/reports/evidence/gen-audit-evidence.sh 2>&1)
          code=$?
          printf '%s\n' "$OUT" | tail -40
          if [ $code -ne 0 ]; then
            echo "::error title=دروازهٔ شاهد::شاهد آزمون معتبر نیست (exit=$code)"
            # لاگ کامل در دسترس نیست؛ خط‌های شکست را به‌صورت annotation بیرون بده
            printf '%s\n' "$OUT" | grep -E 'EVIDENCE-FAIL|FATAL' | head -20 \
              | while IFS= read -r line; do echo "::error title=شاهد::${line}"; done
          fi
          exit $code

      # دروازهٔ امنیت (ردیف ۲۸): آزمون نفوذ خودکار روی محصول واقعی + مدل تهدید.
      # PASS یعنی «۴۰ حملهٔ آزمون‌شده دفع شد»، نه «محصول امن است» (وضعیت: UNKNOWN).
      - name: دروازهٔ امنیت (Security Gate)
        run: bash docs/cloud/reports/evidence/gen-security-gate.sh

      # دروازهٔ ظرفیت/HA/DR (ردیف ۲۹): بار واقعی، قطعی/بازیابی، RPO/RTO، پروب هشدار.
      # «سبز» یعنی «این سنجه‌ها روی یک میزبان اندازه‌گیری شد»، نه «SLA/HA دارد».
      # دروازهٔ بودجهٔ همگام‌سازی (ردیف ۴۲): آستانهٔ بودجهٔ درخواست/بایت به‌ازای
      # کاربر در روز، ETag/۳۰۴، push دسته‌ای و jitter ضد طوفان — همه با اندازه‌گیری
      # واقعی روی سرور، به‌همراه کنترل منفی که ثابت می‌کند آستانه واقعاً قرمز می‌شود.
      # دروازهٔ امنیت ایستا (ردیف ۴۸): dependency scan + SAST (الگو و taint) +
      # اسکن راز، با پنج کنترل منفی که ثابت می‌کنند دروازه واقعاً قرمز می‌شود.
      # توجه: این «پنتست» نیست؛ یافته‌های انسانی همچنان OWNER است.
      - name: دروازهٔ امنیت ایستا (SAST + Dependency Scan — ردیف ۴۸)
        env:
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: |
          set +e
          # نصب در venv اجباری است: رانرهای تازه pip سیستمی را «externally
          # managed» می‌بینند (PEP 668) و نصب مستقیم semgrep شکست می‌خورد.
          SG="$RUNNER_TEMP/sg"
          python3 -m venv "$SG"
          "$SG/bin/python" -m pip install --quiet --disable-pip-version-check "semgrep==1.184.0"
          if [ $? -ne 0 ]; then
            echo "::error title=نصب semgrep::pip install در venv شکست خورد"
            exit 1
          fi
          export SEMGREP_BIN="$SG/bin/semgrep"
          "$SEMGREP_BIN" --version
          npm run test:security48 > /tmp/sec48.log 2>&1
          code=$?
          tail -20 /tmp/sec48.log
          if [ $code -ne 0 ]; then
            # لاگ کامل همیشه در دسترس نیست؛ خط‌های FAIL را «annotation» کن.
            grep -E "^FAIL|SECURITY-48" /tmp/sec48.log | head -12 | while IFS= read -r l; do
              echo "::error title=دروازهٔ امنیت::$l"
            done
          fi
          exit $code

      - name: دروازهٔ بودجهٔ همگام‌سازی (Sync Budget Gate — ردیف ۴۲)
        run: npm run test:cost42

      - name: دروازهٔ موتور مرورگری، PITR و کانال هشدار (ردیف‌های ۳۹، ۵۰، ۵۸)
        run: |
          npm run test:engine
          npm run test:pitr50
          npm run test:alerts

      - name: دروازهٔ ظرفیت و DR (Capacity/DR Gate)
        run: bash docs/cloud/reports/evidence/gen-capacity-gate.sh

      # دروازهٔ پایلوت چند‌مدرسه‌ای (ردیف ۳۰): مهاجرت + reconciliation + rollback + پایش.
      # اگر رانر باینری PostgreSQL نداشته باشد، گام با کد ۳ «BLOCKED» اعلام می‌شود
      # (نه PASS). شاهد محلی کامل در docs/cloud/reports/evidence/cc-pilot-gate.txt است.
      - name: دروازهٔ پایلوت چند‌مدرسه‌ای (Pilot Gate)
        run: |
          set +e
          bash docs/cloud/reports/evidence/gen-pilot-gate.sh
          code=$?
          if [ $code -eq 3 ]; then
            echo "::warning title=دروازهٔ پایلوت::PostgreSQL روی رانر نیست — BLOCKED (نه PASS)"
            exit 0
          fi
          exit $code

      # دروازهٔ پایش/هشدار (ردیف ۴۹): readyz/healthz واقعی، متریک Prometheus،
      # ارزیاب قواعد با `for:` و تکرار، و تحویل هشدار روی HTTP. خرابی، تزریقی
      # است (دایرکتوری داده فقط‌خواندنی) نه شبیه‌سازی.
      # توجه: این «Pager واقعی» نیست؛ اتصال بیرونی و on-call مالک انسانی دارد (ردیف ۵۸).
      - name: دروازهٔ پایش و هشدار (Observability Gate — ردیف ۴۹)
        run: |
          node tools/alerts-49.mjs --check-rules
          npm run test:observability49

      # دروازهٔ بودجهٔ اتصال (ردیف ۴۵): فرمول نمونه‌ها × pool، اعتبارسنجی
      # پیکربندی (NaN/خارج از سقف)، ممیزی حالت نشستی برای transaction pooling،
      # و انطباق deploy/pgbouncer/pgbouncer.ini با بودجه.
      - name: دروازهٔ بودجهٔ اتصال و pooling (Connection Budget — ردیف ۴۵)
        run: |
          node tools/conn-budget-45.mjs
          npm run test:connb45

      # سیاست خواندن (ردیف ۵۲): بدون replica همه‌چیز primary، و ناوردای
      # read-your-writes در همهٔ حالت‌های خطرناک برقرار است.
      - name: آزمون سیاست خواندن (Read Policy — ردیف ۵۲)
        run: npm run test:replica52

      # مهاجرت چند-cell و انتقال مدرسه (ردیف ۵۴): دروازهٔ فعال‌سازی، منطق
      # سه‌لایه، و این‌که Gateway واقعاً نوشتن را در حین انتقال متوقف می‌کند.
      - name: آزمون مهاجرت چند-cell (Cell Transfer — ردیف ۵۴)
        run: npm run test:cell54

      # شناسهٔ تصمیم (ردیف ۶۰): ADR‑31/32/34 نه D‑31/32/34؛ با کنترل منفی.
      - name: دروازهٔ شناسهٔ تصمیم (ADR IDs — ردیف ۶۰)
        run: |
          node tools/adr-ids-60.mjs
          npm run test:adr60

      # گیت برچسب‌های قانون اساسی (ردیف ۵۵): [M]=هدف واقعی، [S]=ماشین توسعه.
      # قرمز می‌شود اگر «[M] اندازه‌گیری‌شده در مخزن» یا [M] کنار عددِ loopback/محلی
      # در اسناد ردیف‌های ۴۵/۴۶/۵۰/۵۵/۵۶/۵۷ برگردد (دستور ثابت، بدون ورودی نامعتبر).
      # مستقیم اجرا می‌شود چون package.json جزو مانیفست انتشار است (تغییرش نیازمند
      # انتشار نسخهٔ تازه است).
      - name: دروازهٔ برچسب‌های قانون اساسی (Labels — ردیف ۵۵)
        run: node tests/labels-gate-55.js

      - name: آزمون رابط، جریان کاربری، صندوقچه و به‌روزرسانی
        run: |
          npm run test:ui
          npm run test:flow
          npm run test:update
          npm run test:tunnel

      # ورود همهٔ نقش‌ها (مدیر، دبیر، دانش‌آموز، ولی، معاون، عامل اجرایی) روی
      # نسخهٔ گوشی بدون سیستم مدرسه — هیچ‌کس نباید به دیوار «نیاز به سیستم
      # مدرسه» بخورد، و هیچ دکمه‌ای نباید خطای اجرایی بدهد.
      - name: آزمون گوشی — ورود همهٔ نقش‌ها
        run: npm run test:phone

      - name: ساخت بسته و مانیفست دلتا
        run: node scripts/build-release.mjs

      # مانیفست باید روی شاخهٔ main باشد تا برنامه‌ها بتوانند «نسخهٔ تازه» را
      # از همین‌جا ببینند و فقط فایل‌های تغییرکرده را بگیرند.
      - name: ثبت مانیفست در مخزن (کانال به‌روزرسانی درجا)
        if: github.ref == 'refs/heads/main'
        run: |
          # کامیت خودکارِ همین مرحله نباید دوباره اجرا شود
          if git log -1 --pretty=%B | grep -q "\[skip ci\]"; then
            echo "کامیت مانیفست؛ رد می‌شود"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/app.js releases/manifest.json releases/history
          if git diff --cached --quiet; then
            echo "مانیفست تغییری نکرد"
            exit 0
          fi
          V=$(node -p "require('./releases/manifest.json').version")
          git commit -m "chore(release): مانیفست $V [skip ci]"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: بررسی Android SDK پیش‌نصب‌شده
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | tail -3 || true

      - uses: gradle/actions/setup-gradle@v3
        # فقط برای حافظهٔ موقت است؛ اگر سرویسش بالا نیاید، ساخت APK باید ادامه دهد
        continue-on-error: true
        with:
          gradle-version: '8.7'

      - name: آماده‌سازی امن کلید امضای release (بدون fallback)
        env:
          PAYESH_KEYSTORE_B64: ${{ secrets.PAYESH_KEYSTORE_B64 }}
          PAYESH_KEYSTORE_PASS: ${{ secrets.PAYESH_KEYSTORE_PASS }}
          PAYESH_KEY_ALIAS: ${{ secrets.PAYESH_KEY_ALIAS }}
          PAYESH_KEY_PASS: ${{ secrets.PAYESH_KEY_PASS }}
          PAYESH_SIGNING_ROTATION_APPROVED: ${{ vars.PAYESH_SIGNING_ROTATION_APPROVED }}
        run: |
          set -euo pipefail
          for name in PAYESH_KEYSTORE_B64 PAYESH_KEYSTORE_PASS PAYESH_KEY_ALIAS PAYESH_KEY_PASS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required Android signing secret is missing: $name"
              exit 1
            fi
          done
          if [ "$PAYESH_SIGNING_ROTATION_APPROVED" != "true" ]; then
            echo "::error::Owner approval for the signing-key migration path is missing; release stopped"
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/payesh-release-signing.p12"
          printf '%s' "$PAYESH_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass:env PAYESH_KEYSTORE_PASS -alias "$PAYESH_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore یا alias ارائه‌شده قابل اعتبارسنجی نیست؛ انتشار متوقف شد"
            exit 1
          fi
          printf 'PAYESH_KEYSTORE=%s\n' "$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "Release signing material prepared in runner temp storage."

      - name: ساخت APK اندروید
        env:
          PAYESH_KEYSTORE: ${{ runner.temp }}/payesh-release-signing.p12
          PAYESH_KEYSTORE_PASS: ${{ secrets.PAYESH_KEYSTORE_PASS }}
          PAYESH_KEY_ALIAS: ${{ secrets.PAYESH_KEY_ALIAS }}
          PAYESH_KEY_PASS: ${{ secrets.PAYESH_KEY_PASS }}
          PAYESH_SIGNING_ROTATION_APPROVED: ${{ vars.PAYESH_SIGNING_ROTATION_APPROVED }}
          # آدرس سامانه که داخل APK پخته می‌شود (تنظیم با gh variable set PAYESH_PUBLIC_URL)
          PAYESH_APP_URL: ${{ vars.PAYESH_PUBLIC_URL }}
          # نام صندوقچهٔ ابری که داخل APK پخته می‌شود (اختیاری — gh variable set CLOUD_BUCKET)
          PAYESH_CLOUD_BUCKET: ${{ vars.CLOUD_BUCKET }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "ساخت APK نسخهٔ $VERSION"
          node scripts/bake-cloud.mjs
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" install/android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" install/android/app/build.gradle
          grep -E "versionName|versionCode" install/android/app/build.gradle
          # نسخهٔ «انتشار» ساخته می‌شود، نه debug:
          #  • debuggable=false → گوگل برنامه را «آزمایشی» نمی‌بیند
          #  • کلید خصوصی فقط از Secrets Owner تأمین می‌شود؛ fallback مخزنی وجود ندارد.
          set +e
          gradle assembleRelease --no-daemon -p install/android > /tmp/gradle.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # خطا را به‌صورت annotation بیرون بده تا بدون لاگ هم دیده شود
            grep -E "What went wrong|FAILURE:|error:|Caused by:|Could not|Execution failed|lint" -A4 /tmp/gradle.log \
              | head -60 | while IFS= read -r line; do echo "::error title=Gradle::$line"; done
            tail -40 /tmp/gradle.log | while IFS= read -r line; do echo "::error title=Gradle tail::$line"; done
            exit $code
          fi
          tail -4 /tmp/gradle.log
          echo "آدرس پخته‌شده در APK: ${PAYESH_APP_URL:-خالی (برنامه از android-config.json یا شبکه پیدا می‌کند)}"

      - name: بررسی امضا و استانداردهای APK (گوگل)
        run: |
          set +e
          APK=install/android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "SDK=$SDK build-tools=$BT"
          # ── ۱) تراز بایت (zipalign): شرط نصب روان و بی‌خطا در اندروید ──
          if [ -n "$BT" ] && [ -x "$BT/zipalign" ]; then
            "$BT/zipalign" -c -v 4 "$APK" > /tmp/align.txt 2>&1
            if [ $? -ne 0 ]; then
              echo "::error::APK تراز (zipalign) نیست — اندروید نصب آن را رد می‌کند"
              tail -5 /tmp/align.txt
              exit 1
            fi
            echo "✓ تراز بایت درست است (zipalign)"
          fi
          # ── ۲) امضای release با کلید Owner ────────────────────────────
          if [ -z "$BT" ] || [ ! -x "$BT/apksigner" ]; then
            echo "::error::Android apksigner در SDK پیدا نشد؛ امضا قابل تأیید نیست"
            exit 1
          fi
          if ! "$BT/apksigner" verify --verbose --print-certs "$APK" > /tmp/sig.txt 2>&1; then
            echo "::error::apksigner failed to verify the release APK"
            exit 1
          fi
          echo "apksigner verification passed"
          head -14 /tmp/sig.txt
          for v in 2 3; do
            if ! grep -Eq "Verified using v$v scheme.*: true" /tmp/sig.txt; then
              echo "::error::امضای v$v نیست — انتشار fail-closed شد"
              grep -i "verified using" /tmp/sig.txt | sed 's/^/::error::/' | head -8
              exit 1
            fi
            echo "✓ امضای v$v درست است"
          done
          if ! grep -q "Signer #1 certificate SHA-256 digest" /tmp/sig.txt; then
            echo "::error::گواهی امضای APK پیدا نشد"
            exit 1
          fi
          SIGNED=yes
          FP=$(grep "Signer #1 certificate SHA-256 digest" /tmp/sig.txt | tr -d ' ' | cut -d: -f2 | tr 'A-F' 'a-f')
          echo "اثر انگشت گواهی (غیرمحرمانه): $FP"
          echo "اثر انگشت با fingerprint ثبت‌شدهٔ قبلی مقایسه نمی‌شود؛ مسیر انتقال v3 باید توسط Owner تأیید شود."
          [ "$SIGNED" = yes ] || { echo "::error::APK امضا نشده — انتشار fail-closed شد"; exit 1; }
          echo "APK امضا شده است."

      - name: بررسی سلامت APK
        run: |
          APK=install/android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK" || { echo "APK ساخته نشد"; exit 1; }
          # نسخهٔ منتشرشده نباید «اشکال‌زدایی‌شدنی» باشد؛ وگرنه گوگل آن را
          # برنامهٔ آزمایشی می‌شناسد و هنگام نصب هشدار می‌دهد.
          SDK2="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT2=$(ls -d "$SDK2"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BT2" ] && [ -x "$BT2/aapt" ]; then
            if "$BT2/aapt" dump badging "$APK" 2>/dev/null | grep -q "application-debuggable"; then
              echo "::error::APK نسخهٔ debug است — باید نسخهٔ release ساخته شود"
              exit 1
            fi
            echo "✓ نسخهٔ انتشار است (debuggable=false)"
            "$BT2/aapt" dump badging "$APK" 2>/dev/null | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|uses-permission)" | head -12
          fi
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          # برنامهٔ کاملِ وب باید داخل APK باشد (نه یک پوستهٔ خالی)
          for f in assets/www/index.html assets/www/app.js assets/www/pages.js assets/www/styles.css assets/www/sw.js assets/www/lib/s3mini.js assets/www/lib/sigv4.js assets/www/lib/phone.js assets/www/lib/hash.js assets/www/lib/xlsx.js assets/www/cloud-baked.js; do
            unzip -l "$APK" | grep -q "$f" || { echo "کم است: $f — APK فقط پوسته است"; exit 1; }
          done
          COUNT=$(unzip -l "$APK" | grep -c "assets/www/")
          echo "فایل‌های برنامه داخل APK: $COUNT"
          [ "$COUNT" -ge 10 ] || { echo "تعداد فایل‌های برنامه کم است"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          echo "APK سالم است: $SIZE بایت"
          [ "$SIZE" -ge 150000 ] || { echo "حجم APK برای نسخهٔ کامل خیلی کم است ($SIZE)"; exit 1; }

      - name: ساخت بستهٔ استقرار ابری (payesh-cloud.zip)
        run: node scripts/build-cloud-bundle.mjs

      - name: آماده‌سازی فایل‌های انتشار
        run: |
          mkdir -p out
          cp install/android/app/build/outputs/apk/release/app-release.apk out/payesh-local.apk
          # نام ثابت برای لینک‌های همیشه‌درست در README
          cp releases/payesh-local-windows-*.zip out/payesh-local-windows.zip
          cp releases/*.zip releases/*.tar.gz out/ 2>/dev/null || true
          cp releases/manifest.json out/manifest.json
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: payesh-local
          path: out/*

      - name: انتشار پیوسته (هر push روی main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view continuous >/dev/null 2>&1; then
            echo "release exists"
          else
            gh release create continuous --prerelease \
              --title "آخرین نسخهٔ ساخته‌شده" \
              --notes "این نسخه با هر push روی main به‌روز می‌شود. لینک‌های ثابت: payesh-local-windows.zip و payesh-local.apk"
          fi
          for i in 1 2 3; do
            gh release upload continuous out/payesh-local.apk out/payesh-local-windows.zip out/payesh-cloud.zip out/manifest.json --clobber && break
            echo "تلاش $i ناموفق بود؛ ۱۵ ثانیه بعد دوباره"; sleep 15
          done

      - name: انتشار (روی تگ)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/payesh-local.apk
            out/payesh-local-windows.zip
            out/payesh-local-windows-*.zip
            out/manifest.json
          generate_release_notes: true
          body: |
            ## پایش-لوکال
            - بستهٔ ویندوز: `payesh-local-windows-*.zip` (از حالت فشرده خارج کنید و `install.bat` را اجرا کنید)
            - اندروید: `payesh-local.apk` (نصب از منابع ناشناس را اجازه دهید)
            - آیفون: از Safari باز کنید و «افزودن به صفحهٔ اصلی»
            - به‌روزرسانی برنامه‌ها یک‌کلیکی و فقط با فایل‌های تغییرکرده انجام می‌شود.

      - name: پاکسازی کلید امضای موقت
        if: always()
        run: rm -f "$RUNNER_TEMP/payesh-release-signing.p12"

  windows-installer:
    concurrency:
      group: payesh-release-${{ github.ref }}
      cancel-in-progress: false
    name: نصب‌کنندهٔ استاندارد ویندوز (payesh-setup.exe)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Node قابل حمل تا نصب بدون اینترنت هم کامل انجام شود
      - name: آوردن Node قابل حمل
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime | Out-Null
          $url = 'https://nodejs.org/dist/v22.14.0/win-x64/node.exe'
          Invoke-WebRequest -Uri $url -OutFile runtime/node.exe -UseBasicParsing
          "node.exe: {0:N1} MB" -f ((Get-Item runtime/node.exe).Length / 1MB)

      - name: آماده‌سازی پوشهٔ نصب
        run: node scripts/stage-windows.mjs

      - name: ساخت برنامهٔ ویندوز (Payesh.exe — پنجرهٔ واقعی + شناسنامه)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = 'build-win.log'
          powershell -ExecutionPolicy Bypass -File desktop\build.ps1 -Out .build\win\desktop *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            Get-Content $log | Select-Object -Last 30 | ForEach-Object { "::error title=build.ps1::$_" }
            exit 1
          }
          try {
            $exe = '.build\win\desktop\Payesh.exe'
            if (-not (Test-Path $exe)) { throw 'Payesh.exe ساخته نشد' }
            Get-ChildItem .build\win\desktop | Select-Object Name, Length | Format-Table
            # ── استاندارد مایکروسافت: شناسنامهٔ فایل نباید خالی باشد ────────
            $vi = (Get-Item $exe).VersionInfo
            "ProductName=$($vi.ProductName)  Company=$($vi.CompanyName)  FileVersion=$($vi.FileVersion)"
            if (-not $vi.ProductName) { throw 'شناسنامهٔ فایل اجرایی خالی است (ProductName)' }
            if (-not $vi.CompanyName) { throw 'شناسنامهٔ فایل اجرایی خالی است (CompanyName)' }
            if (-not $vi.FileVersion) { throw 'نسخهٔ فایل نوشته نشده است' }
            # ── مانیفست asInvoker باید داخل exe باشد (بدون درخواست مدیر) ───
            $txt = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes((Resolve-Path $exe)))
            if ($txt -notmatch 'asInvoker') { throw 'مانیفست asInvoker داخل exe نیست' }
            if ($txt -notmatch 'supportedOS') { throw 'شناسهٔ ویندوز ۱۰/۱۱ در مانیفست نیست' }
            "✓ شناسنامه و مانیفست برنامهٔ ویندوز درست است"
          } catch {
            "::error title=Payesh.exe::$($_.Exception.Message)"
            $pos = ($_.InvocationInfo.PositionMessage -replace "`r?`n", ' ')
            "::error title=Payesh.exe خط::$pos"
            exit 1
          }

      - name: نصب Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'ISCC پیدا نشد' }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: بازبینی اسکریپت نصب
        run: node scripts/lint-iss.mjs

      - name: ساخت payesh-setup.exe
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          & $env:ISCC "/DAppVersion=$v" "installer\payesh.iss" 2>&1 | Tee-Object -FilePath iscc.log
          if ($LASTEXITCODE -ne 0) {
            # گیت‌هاب بیشتر از ۱۰ خط annotation در هر گام نشان نمی‌دهد؛ پس
            # اول خط‌های خطا/هشدار را بیرون می‌کشیم و بعد ۴ خط آخر لاگ را.
            $errs = @(Get-Content iscc.log | Where-Object { $_ -match 'Error|error|Warning|Compiling|Unknown|Duplicate|Unable' } | Select-Object -First 6)
            $tail = @(Get-Content iscc.log -Tail 4)
            ($errs + $tail) | Select-Object -Unique | ForEach-Object { "::error::ISCC: $_" }
            throw "ISCC ناموفق ($LASTEXITCODE)"
          }
          $exe = 'releases/payesh-setup.exe'
          if (-not (Test-Path $exe)) { throw 'خروجی exe ساخته نشد' }
          "✓ {0:N1} MB — نسخهٔ {1}" -f ((Get-Item $exe).Length/1MB), $v

      # بستهٔ ویندوز باید پنجرهٔ واقعی برنامه را همراه داشته باشد؛ وگرنه کاربرِ
      # نسخهٔ zip با «میان‌بر مرورگر» روبه‌رو می‌شد (شکایت کاربر).
      - name: بستهٔ ویندوز همراه برنامهٔ پنجره‌ای
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'releases/payesh-local-windows.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          $exe = '.build\win\desktop\Payesh.exe'
          if (-not (Test-Path $exe)) { throw 'Payesh.exe در بسته نیست' }
          Compress-Archive -Path '.build\win\*' -DestinationPath $zip -CompressionLevel Optimal
          "{0:N1} MB — {1}" -f ((Get-Item $zip).Length/1MB), $zip
          # بازبینی: فایل اجرایی و موتور نمایش داخل بسته باشند
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = $z.Entries | ForEach-Object { $_.FullName }
            foreach ($need in @('desktop/Payesh.exe', 'server/index.js', 'client/index.html', 'runtime/node.exe')) {
              $hit = $names | Where-Object { $_ -like "*$need" }
              if (-not $hit) { throw "در بستهٔ ویندوز نیست: $need" }
            }
            "✓ بسته شامل برنامه، سرور و Node است"
          } finally { $z.Dispose() }

      - uses: actions/upload-artifact@v4
        with:
          name: payesh-setup
          path: |
            releases/payesh-setup.exe
            releases/payesh-local-windows.zip

      - name: انتشار در انتشار پیوسته
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload continuous releases/payesh-setup.exe --clobber
          gh release upload continuous releases/payesh-local-windows.zip --clobber
          gh release view continuous --json assets --jq '.assets[] | select(.name=="payesh-setup.exe" or .name=="payesh-local-windows.zip") | "\(.name) — \(.size) بایت"'
