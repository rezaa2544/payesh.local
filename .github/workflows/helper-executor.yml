name: helper-executor
# Row 207 — GitHub Actions executor for the Helper job queue (batch only).
# Never-fail semantics: missing secrets => green run with configured:false.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read

concurrency:
  group: helper-executor
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Poll Helper queue (max 5 jobs)
        env:
          PAYESH_HELPER_S3_ENDPOINT: ${{ secrets.PAYESH_HELPER_S3_ENDPOINT }}
          PAYESH_HELPER_S3_BUCKET: ${{ secrets.PAYESH_HELPER_S3_BUCKET }}
          PAYESH_HELPER_S3_ACCESS_KEY: ${{ secrets.PAYESH_HELPER_S3_ACCESS_KEY }}
          PAYESH_HELPER_S3_SECRET_KEY: ${{ secrets.PAYESH_HELPER_S3_SECRET_KEY }}
          HELPER_MAX_JOBS: '5'
        run: node tools/helper-executor/run.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: helper-executor-report
          path: helper-executor-report.json
          retention-days: 30
