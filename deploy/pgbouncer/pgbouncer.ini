; PgBouncer — ردیف ۴۵ (بودجهٔ اتصال)
;
; چرا transaction pooling؟ چون هیچ‌جای کد Gateway به نشست گره نمی‌خورد:
; هر عملیات در یک تراکنش با set_config(..., true) انجام می‌شود و پس از
; commit زمینهٔ مستأجر پاک می‌شود (tenancy.withTenant + readiness). ممیزی
; خودکار در tools/conn-budget-45.mjs همین را روی کد بررسی می‌کند
; (advisory lock / LISTEN / SET SESSION / جدول موقت / PREPARE سطح نشست).
;
; قاعدهٔ سخت: default_pool_size هرگز از pool هر نمونهٔ Gateway بیشتر نباشد،
; وگرنه عدد «بودجه» و عدد «واقعیت» دوتا می‌شوند. آزمون
; tests/conn-budget-45.js همین انطباق را قرمز می‌کند.
;
; مستقر در: /etc/pgbouncer/pgbouncer.ini  (اجرای واقعی: OWNER)

[databases]
; نام پایگاه برنامه، با نام کاربری اجرایی (نه مالک) — RLS با همین نقش اعمال می‌شود
payesh = host=db.internal port=5432 dbname=payesh user=payesh_runtime

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; ── حالت pooling ────────────────────────────────────────────────
pool_mode = transaction

; سقف اتصال‌های ورودی: نمونه‌ها × pool + ذخیره + فضای کلاینت‌های کوتاه‌عمر
max_client_conn = 400

; اندازهٔ pool در سمت DB — باید ≤ بودجهٔ هر نمونه باشد (ردیف ۴۵)
default_pool_size = 12
min_pool_size = 1
reserve_pool_size = 2
reserve_pool_timeout = 3

; اتصال‌های اضافی که پس از بی‌کاری بسته می‌شوند (جلوگیری از نگه‌داشتن بی‌دلیل)
max_db_connections = 60
server_idle_timeout = 60
server_lifetime = 3600
query_wait_timeout = 15

; پایش
stats_period = 60
log_connections = 0
log_disconnections = 0
