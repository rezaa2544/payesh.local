<!DOCTYPE html>
<!-- Row 169 (D-50): the 32-bit Windows edition of the school app — the same Flutter code compiled to
     JavaScript, shown by tools/web32/shell (CEF 109 x86) from the shell's private scheme.
     Row 199: the very same build is also the browser edition at https://app.payeshschool.ir —
     without the shell the app keeps its files in this browser's IndexedDB (payesh_idb.js). -->
<html lang="fa" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="پایش مدرسه — نسخهٔ مرورگر">
  <meta name="theme-color" content="#5b4bdb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="پایش مدرسه">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>پایش مدرسه</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f6f7fb; }
    #payesh-loading { position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; font: 16px Tahoma, sans-serif; color: #334; }
  </style>
</head>
<body>
  <div id="payesh-loading">در حال آماده‌سازی پایش مدرسه…</div>
  <noscript>برای اجرای پایش مدرسه، جاوااسکریپت مرورگر را روشن کنید.</noscript>
  <script src="payesh_idb.js"></script>
  <script>
    // Row 199 (row 171 follow-up): inside the 32-bit shell (http://payesh.localhost) the app MUST
    // have the shell's real files (window.payeshHost). On the first navigation of a fresh renderer
    // CEF can create the page without it; starting Flutter then would silently use this
    // renderer's IndexedDB instead of the disk. Reload (at most 3 times) before Flutter starts —
    // the new document gets the host. A plain browser (app.payeshschool.ir) never reloads.
    (function () {
      if (location.protocol + '//' + location.host === 'http://payesh.localhost' && !window.payeshHost) {
        var m = /[?&]host-retry=(\d)/.exec(location.search);
        var n = m ? Number(m[1]) : 0;
        if (n < 3) {
          location.replace(location.pathname + '?host-retry=' + (n + 1) + location.hash);
          return;
        }
      }
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
