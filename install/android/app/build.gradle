plugins { id 'com.android.application' }

/* ── آدرس سامانه که داخل خودِ برنامه «پخته» می‌شود ────────────────────
   ترتیب اولویت: متغیر محیطی PAYESH_APP_URL  →  فایل url.properties
   اگر خالی باشد، برنامه آدرس را از android-config.json مخزن یا شبکه پیدا می‌کند. */
def payeshUrl = ""
def urlProps = file("url.properties")
if (urlProps.exists()) {
    def p = new Properties()
    urlProps.withInputStream { p.load(it) }
    payeshUrl = (p.getProperty("url", "") ?: "").trim()
}
if (System.getenv("PAYESH_APP_URL")) {
    payeshUrl = System.getenv("PAYESH_APP_URL").trim()
}

/* ── نام صندوقچهٔ ابری (اگر معلوم باشد، داخل برنامه پخته می‌شود) ────────
   با متغیر محیطی PAYESH_CLOUD_BUCKET یا فایل url.properties (bucket=…)
   خالی باشد هم برنامه خودش پیدایش می‌کند. */
def payeshBucket = ""
if (urlProps.exists()) {
    def p2 = new Properties()
    urlProps.withInputStream { p2.load(it) }
    payeshBucket = (p2.getProperty("bucket", "") ?: "").trim()
}
if (System.getenv("PAYESH_CLOUD_BUCKET")) {
    payeshBucket = System.getenv("PAYESH_CLOUD_BUCKET").trim()
}

def signingEnv = [
    keystore: System.getenv('PAYESH_KEYSTORE'),
    storePassword: System.getenv('PAYESH_KEYSTORE_PASS'),
    alias: System.getenv('PAYESH_KEY_ALIAS'),
    keyPassword: System.getenv('PAYESH_KEY_PASS'),
]
def releaseSigningReady = signingEnv.values().every { it != null && !it.trim().isEmpty() }
def signingRotationApproved = 'true'.equalsIgnoreCase(System.getenv('PAYESH_SIGNING_ROTATION_APPROVED')?.trim())

gradle.taskGraph.whenReady { taskGraph ->
    def isReleaseBuild = taskGraph.allTasks.any { it.name.toLowerCase(Locale.ROOT).contains('release') }
    if (isReleaseBuild && !releaseSigningReady) {
        throw new GradleException('Release signing credentials are missing; release builds fail closed.')
    }
    if (isReleaseBuild && !signingRotationApproved) {
        throw new GradleException('Owner approval for the signing-key migration path is missing; release builds fail closed.')
    }
}

android {
    namespace 'ir.payesh.local'
    compileSdk 34

    defaultConfig {
        applicationId "ir.payesh.local"
        minSdk 23
        targetSdk 34
        /* با هر انتشار یکی زیاد شود؛ اندروید فقط نسخه‌ای را روی نسخهٔ
           نصب‌شده می‌پذیرد که شمارهٔ ساختش بزرگ‌تر یا مساوی باشد. */
        versionCode 835
        versionName "0.8.35"
        resConfigs "fa", "en"
        buildConfigField "String", "PAYESH_URL", '"' + payeshUrl.replace('"', '') + '"'
        buildConfigField "String", "PAYESH_CLOUD_BUCKET", '"' + payeshBucket.replace('"', '') + '"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(signingEnv.keystore)
                storeType 'PKCS12'
                storePassword signingEnv.storePassword
                keyAlias signingEnv.alias
                keyPassword signingEnv.keyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            // Local debug builds use Android's standard machine-local debug key.
        }
        release {
            /* انتشار فقط با کلید خصوصی تأمین‌شده از محیط امن CI؛ هیچ fallback
               به کلید عمومی/ثابت داخل مخزن وجود ندارد. */
            debuggable false
            minifyEnabled false
            shrinkResources false
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/* ── «همه‌چیز داخل APK» ──────────────────────────────────────────────
   کل برنامهٔ وب (HTML/JS/CSS/آیکون‌ها = همان چیزی که سرور سرو می‌کند)
   پیش از ساخت داخل assets/www کپی می‌شود؛ برنامه بدون هیچ سروری هم
   بالا می‌آید و فقط برای همگام‌سازی به سرور وصل می‌شود. */
def webSrc = rootProject.file('../../client')
def webDst = file("$projectDir/src/main/assets/www")
tasks.register('bundleWebAssets', Copy) {
    from(webSrc) {
        exclude '**/node_modules/**', '**/*.map', '**/.DS_Store'
    }
    into webDst
}
tasks.named('preBuild').configure { dependsOn 'bundleWebAssets' }

dependencies {
    /* ── خواندن QR کارت پیوند ─────────────────────────────────────
       دو کتابخانهٔ سبک و بدون سرویس گوگل (روی گوشی‌های بدون Play هم
       کار می‌کنند): یکی برای دوربینِ زنده، یکی برای خواندن QR از عکسِ
       گالری. هیچ مجوز حساسی هم لازم نمی‌شود. */
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}
