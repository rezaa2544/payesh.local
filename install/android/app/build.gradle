plugins { id 'com.android.application' }

/* ── آدرس سامانه که داخل خودِ برنامه «پخته» می‌شود ────────────────────
   ترتیب اولویت: متغیر محیطی PAYESH_APP_URL  →  فایل url.properties
   اگر خالی باشد، برنامه آدرس را از android-config.json مخزن یا شبکه پیدا می‌کند. */
def payeshUrl = ""
def urlProps = file("url.properties")
if (urlProps.exists()) {
    def p = new Properties()
    urlProps.withInputStream { p.load(it) }
    payeshUrl = (p.getProperty("url", "") ?: "").trim()
}
if (System.getenv("PAYESH_APP_URL")) {
    payeshUrl = System.getenv("PAYESH_APP_URL").trim()
}

android {
    namespace 'ir.payesh.local'
    compileSdk 34

    defaultConfig {
        applicationId "ir.payesh.local"
        minSdk 23
        targetSdk 34
        /* مقدارها توسط اسکریپت ساخت/CI به‌روز می‌شوند */
        versionCode 1
        versionName "0.1.1"
        resConfigs "fa", "en"
        buildConfigField "String", "PAYESH_URL", '"' + payeshUrl.replace('"', '') + '"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        /* اگر در CI کلید موجود باشد از آن استفاده می‌شود، وگرنه debug */
        if (System.getenv("PAYESH_KEYSTORE")) {
            release {
                storeFile file(System.getenv("PAYESH_KEYSTORE"))
                storePassword System.getenv("PAYESH_KEYSTORE_PASS")
                keyAlias System.getenv("PAYESH_KEY_ALIAS")
                keyPassword System.getenv("PAYESH_KEY_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("PAYESH_KEYSTORE")) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/* ── «همه‌چیز داخل APK» ──────────────────────────────────────────────
   کل برنامهٔ وب (HTML/JS/CSS/آیکون‌ها = همان چیزی که سرور سرو می‌کند)
   پیش از ساخت داخل assets/www کپی می‌شود؛ برنامه بدون هیچ سروری هم
   بالا می‌آید و فقط برای همگام‌سازی به سرور وصل می‌شود. */
def webSrc = rootProject.file('../../client')
def webDst = file("$projectDir/src/main/assets/www")
tasks.register('bundleWebAssets', Copy) {
    from(webSrc) {
        exclude '**/node_modules/**', '**/*.map', '**/.DS_Store'
    }
    into webDst
}
tasks.named('preBuild').configure { dependsOn 'bundleWebAssets' }

dependencies { }
