plugins { id 'com.android.application' }

/* ── آدرس سامانه که داخل خودِ برنامه «پخته» می‌شود ────────────────────
   ترتیب اولویت: متغیر محیطی PAYESH_APP_URL  →  فایل url.properties
   اگر خالی باشد، برنامه آدرس را از android-config.json مخزن یا شبکه پیدا می‌کند. */
def payeshUrl = ""
def urlProps = file("url.properties")
if (urlProps.exists()) {
    def p = new Properties()
    urlProps.withInputStream { p.load(it) }
    payeshUrl = (p.getProperty("url", "") ?: "").trim()
}
if (System.getenv("PAYESH_APP_URL")) {
    payeshUrl = System.getenv("PAYESH_APP_URL").trim()
}

/* ── نام صندوقچهٔ ابری (اگر معلوم باشد، داخل برنامه پخته می‌شود) ────────
   با متغیر محیطی PAYESH_CLOUD_BUCKET یا فایل url.properties (bucket=…)
   خالی باشد هم برنامه خودش پیدایش می‌کند. */
def payeshBucket = ""
if (urlProps.exists()) {
    def p2 = new Properties()
    urlProps.withInputStream { p2.load(it) }
    payeshBucket = (p2.getProperty("bucket", "") ?: "").trim()
}
if (System.getenv("PAYESH_CLOUD_BUCKET")) {
    payeshBucket = System.getenv("PAYESH_CLOUD_BUCKET").trim()
}

android {
    namespace 'ir.payesh.local'
    compileSdk 34

    defaultConfig {
        applicationId "ir.payesh.local"
        minSdk 23
        targetSdk 34
        /* با هر انتشار یکی زیاد شود؛ اندروید فقط نسخه‌ای را روی نسخهٔ
           نصب‌شده می‌پذیرد که شمارهٔ ساختش بزرگ‌تر یا مساوی باشد. */
        versionCode 824
        versionName "0.8.24"
        resConfigs "fa", "en"
        buildConfigField "String", "PAYESH_URL", '"' + payeshUrl.replace('"', '') + '"'
        buildConfigField "String", "PAYESH_CLOUD_BUCKET", '"' + payeshBucket.replace('"', '') + '"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        /* ── کلید ثابتِ خودِ برنامه ────────────────────────────────────────
           چرا لازم است: اگر هر ساخت با کلید تازه امضا شود (کلید debug روی
           هر ماشین و هر اجرای CI از نو ساخته می‌شود)، اندروید نصب نسخهٔ
           تازه را روی نسخهٔ قبلی قبول نمی‌کند و می‌گوید «برنامه نصب نشد»
           یا «بستهٔ برنامه مشکل دارد». با یک کلید ثابت، هر نسخهٔ بعدی
           روی قبلی نصب می‌شود و داده‌ها سر جایشان می‌مانند.

           اگر در CI کلید خصوصی جدا گذاشته شود (PAYESH_KEYSTORE و …)
           همان مقدم است. */
        stable {
            /* امضا در هر سه قالب استاندارد گوگل: v1 (قدیمی)، v2 (اندروید ۷+)
               و v3 (اندروید ۹+). بدون این‌ها بعضی گوشی‌ها هنگام نصب
               «بستهٔ برنامه مشکل دارد» یا «برنامه تأیید نشد» می‌گویند. */
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            if (System.getenv("PAYESH_KEYSTORE")) {
                storeFile file(System.getenv("PAYESH_KEYSTORE"))
                storePassword System.getenv("PAYESH_KEYSTORE_PASS")
                keyAlias System.getenv("PAYESH_KEY_ALIAS")
                keyPassword System.getenv("PAYESH_KEY_PASS")
            } else {
                storeFile file("../payesh-signing.p12")
                storeType "PKCS12"
                storePassword "payesh1404"
                keyAlias "payesh"
                keyPassword "payesh1404"
            }
        }
    }

    buildTypes {
        debug {
            /* همین نسخهٔ داخل مخزن هم با کلید ثابت امضا می‌شود */
            signingConfig signingConfigs.stable
        }
        release {
            /* نسخهٔ انتشار: بدون قابلیت اشکال‌زدایی — همان چیزی که برای
               نصب روی گوشی کاربران استاندارد است (نسخهٔ debug را گوگل
               «برنامهٔ آزمایشی» می‌شناسد و ممکن است هشدار بدهد). */
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/* ── «همه‌چیز داخل APK» ──────────────────────────────────────────────
   کل برنامهٔ وب (HTML/JS/CSS/آیکون‌ها = همان چیزی که سرور سرو می‌کند)
   پیش از ساخت داخل assets/www کپی می‌شود؛ برنامه بدون هیچ سروری هم
   بالا می‌آید و فقط برای همگام‌سازی به سرور وصل می‌شود. */
def webSrc = rootProject.file('../../client')
def webDst = file("$projectDir/src/main/assets/www")
tasks.register('bundleWebAssets', Copy) {
    from(webSrc) {
        exclude '**/node_modules/**', '**/*.map', '**/.DS_Store'
    }
    into webDst
}
tasks.named('preBuild').configure { dependsOn 'bundleWebAssets' }

dependencies { }
