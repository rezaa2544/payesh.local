# اجرا: docker compose up -d   →  http://SERVER:8080
services:
  payesh:
    build: .
    container_name: payesh
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      PAYESH_DATA: /data
      PAYESH_TUNNEL_AUTO: "0"
      # PAYESH_PUBLIC_URL: https://payesh.example.ir
    volumes:
      - payesh-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  payesh-data:
