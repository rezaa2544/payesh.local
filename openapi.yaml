openapi: 3.0.3
info:
  title: Payesh school server, data gateway and tenancy API
  version: "1"
  description: |
    Contract of the real HTTP surface of server/index.js, server/gateway.js and server/tenancy.js.
    Row 81. The drift gate `node tools/openapi-drift-81.mjs` fails CI when a route is added, removed
    or changes method in code without this file being updated (and vice versa).
    The owner platform API (/api/platform/v1/*) has its own contract: apps/owner-panel/server/openapi.json.
    Sync semantics (cursors, idempotency, OCC, scope) are normative in docs/cloud/contracts/sync-v1.md.
    Native clients (D-43) use only the operations tagged auth, sync, live and gateway.
servers:
  - url: /
    description: Same origin. School server (default port 8080) or gateway; addresses come from the Directory, never hard-coded in clients.
tags:
  - name: auth
  - name: sync
  - name: live
  - name: gateway
  - name: phone
  - name: outbox
  - name: setup
  - name: admin
    description: Manager-only (403 forbidden for other roles; backups also allow BACKUP_ROLES).
  - name: cloud-tenancy
    description: Tenant-scoped cloud slice; tenant comes only from the signed token (RLS). 404 tenancy_disabled when off.
  - name: ops
security:
  - session: []
