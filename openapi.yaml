components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: School server session token (opaque, 64 hex chars), from /api/auth/login, /api/auth/refresh or /api/auth/pair.
    gateway:
      type: http
      scheme: bearer
      bearerFormat: v1.<b64url claims>.<b64url hmac-sha256>
      description: Signed gateway token issued by the Directory (claims v, tid, cell, role, uid, did, iat, exp). The tenant comes only from the token.
    tenancy:
      type: http
      scheme: bearer
      description: Signed tenancy token (same format as gateway).
    metrics:
      type: http
      scheme: bearer
      description: Optional metrics token; when not configured, metrics stay open (backwards compatible).
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 80
  responses:
    Ok:
      description: Success envelope
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok:
                type: boolean
            additionalProperties: true
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: rate_limited (respect Retry-After / retry_after_ms)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string
        limit:
          type: integer
        retry_after_ms:
          type: integer
        detail:
          nullable: true
      additionalProperties: true
    Role:
      type: string
      enum: [manager, teacher, parent, student, counselor, guard, support]
    User:
      type: object
      required: [id, role]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        phone:
          type: string
        class_id:
          type: integer
          nullable: true
        active:
          type: boolean
      additionalProperties: true
    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          description: Mobile number (Persian or Latin digits), at least 10 digits.
        password:
          type: string
          minLength: 4
        name:
          type: string
          description: Device display name
        platform:
          type: string
          enum: [android, windows, web, server, ios]
    Session:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
    AuthResult:
      type: object
      required: [ok, user, session]
      properties:
        ok:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/Session'
        device_token:
          type: string
          description: Long-lived device credential; store only in platform secure storage (Keystore / DPAPI).
        auth:
          type: string
          enum: [password, device, pair]
      additionalProperties: true
    Tombstone:
      type: object
      required: [collection, id, at]
      properties:
        collection:
          type: string
        id:
          type: integer
        at:
          type: string
          format: date-time
    PullResponse:
      type: object
      required: [ok, schema_version, server_time, since, more, collections, deleted]
      properties:
        ok:
          type: boolean
        schema_version:
          type: integer
          enum: [1]
        server_time:
          type: string
          format: date-time
        etag:
          type: string
        since:
          type: string
          format: date-time
        since_id:
          type: integer
        next_since:
          type: string
          format: date-time
          nullable: true
        next_id:
          type: integer
          nullable: true
        more:
          type: boolean
        limits:
          type: object
          properties:
            row_limit:
              type: integer
            max_ops:
              type: integer
        collections:
          type: object
          description: Absent collection means no change. Rows carry _version for base_version.
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: true
        deleted:
          type: array
          items:
            $ref: '#/components/schemas/Tombstone'
    PushOp:
      type: object
      required: [uid, collection, data]
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 80
        collection:
          type: string
        type:
          type: string
          enum: [put, del]
          default: put
        id:
          type: integer
        base_version:
          type: integer
        data:
          type: object
          additionalProperties: true
    PushRequest:
      type: object
      required: [ops]
      properties:
        idempotency_key:
          type: string
          maxLength: 120
        ops:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/PushOp'
    PushResponse:
      type: object
      required: [ok, schema_version, applied, conflicts, rejected]
      properties:
        ok:
          type: boolean
        schema_version:
          type: integer
          enum: [1]
        server_time:
          type: string
          format: date-time
        replayed:
          type: boolean
        idempotency_key:
          type: string
        applied:
          type: array
          items:
            type: object
            required: [uid]
            properties:
              uid:
                type: string
              id:
                type: integer
              version:
                type: integer
              duplicate:
                type: boolean
              deleted:
                type: boolean
        conflicts:
          type: array
          items:
            type: object
            required: [uid, collection, id, server_version]
            properties:
              uid:
                type: string
              collection:
                type: string
              id:
                type: integer
              server_version:
                type: integer
              server:
                type: object
                additionalProperties: true
              conflict_id:
                type: integer
        rejected:
          type: array
          items:
            type: object
            required: [uid, error]
            properties:
              uid:
                type: string
              error:
                type: string
              conflict_id:
                type: integer
    GwFeedRow:
      type: object
      required: [seq, collection, id, op]
      properties:
        seq:
          type: integer
        collection:
          type: string
        id:
          type: integer
        op:
          type: string
          enum: [put, del]
        version:
          type: integer
        data:
          type: object
          nullable: true
          additionalProperties: true
        at:
          type: string
          format: date-time
    GwPullResponse:
      type: object
      required: [ok, schema_version, rows, more]
      properties:
        ok:
          type: boolean
        schema_version:
          type: integer
          enum: [1]
        instance:
          type: string
        clamped_limit:
          type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/GwFeedRow'
        more:
          type: boolean
        next_seq:
          type: integer
        scope:
          type: object
          additionalProperties: true
        limits:
          type: object
          additionalProperties: true
        read_from:
          type: string
        read_reason:
          type: string
      additionalProperties: true
    GwPushOp:
      type: object
      required: [uid, collection, type, id]
      properties:
        uid:
          type: string
          maxLength: 80
        collection:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,40}$'
        type:
          type: string
          enum: [put, del]
        id:
          type: integer
          minimum: 1
        data:
          type: object
          additionalProperties: true
          description: At most 64 KiB serialized.
        base_version:
          type: integer
          nullable: true
    GwPushRequest:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/GwPushOp'
    GwPushResponse:
      type: object
      required: [ok, schema_version]
      properties:
        ok:
          type: boolean
        schema_version:
          type: integer
          enum: [1]
        instance:
          type: string
        applied:
          type: array
          items:
            type: object
            additionalProperties: true
        duplicates:
          type: array
          items:
            type: object
            additionalProperties: true
        conflicts:
          type: array
          items:
            type: object
            additionalProperties: true
        counts:
          type: object
          additionalProperties:
            type: integer
      additionalProperties: true
